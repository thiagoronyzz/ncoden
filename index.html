<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NCODE N — Oficina de Jogos · 400 jogos de precisão</title>
<meta name="description" content="NCODE N: uma oficina editorial com 400 minijogos originais — puzzle, arcade, estratégia, simulação, física, ritmo, palavras, cartas, stealth, corrida, sobrevivência, exploração, festa e precisão.">
<meta name="theme-color" content="#F4F1EB">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="NCODE N — Oficina de Jogos · 400 jogos originais">
<meta property="og:description" content="400 minijogos originais no navegador: puzzle, arcade, estratégia, simulação, física, ritmo, palavras, cartas, stealth, corrida, sobrevivência, exploração, festa e precisão. Sem conta, sem servidor — progresso no seu navegador.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="NCODE N — Oficina de Jogos">
<meta name="twitter:description" content="400 minijogos originais jogáveis no navegador, com identidade editorial tátil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body>
<header class="masthead">
  <div class="mast-in">
    <a class="brand" href="index.html" aria-label="NCODE N — início">
      <svg class="brand-mark" viewBox="0 0 64 64" width="34" height="34" aria-hidden="true" focusable="false">
        <rect class="bm-box" x="1" y="1" width="62" height="62" rx="12"/>
        <rect class="bm-frame" x="7.75" y="7.75" width="48.5" height="48.5" rx="8"/>
        <rect class="bm-n" x="11" y="18" width="8" height="28"/>
        <rect class="bm-n" x="35" y="18" width="8" height="28"/>
        <path class="bm-n" d="M11 18h8l24 28h-8z"/>
        <circle class="bm-dot" cx="49" cy="41.5" r="4.5"/>
      </svg>
      <span><b>NCODE N</b><small>OFICINA DE JOGOS</small></span>
    </a>
    <span class="mast-meta">// CATÁLOGO · 400 PEÇAS</span>
    <span class="mast-sp"></span>
    <button class="iconbtn" id="btnSurprise" title="Jogo aleatório"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="8" r="2" fill="currentColor"/><circle cx="16" cy="8" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="16" r="2" fill="currentColor"/><circle cx="16" cy="16" r="2" fill="currentColor"/></svg><span class="lbl">SURPRESA</span></button>
    <button class="iconbtn" id="btnTheme" title="Alternar tema"><span id="themeIc" aria-hidden="true">◐</span><span class="lbl" id="themeLbl">ESCURO</span></button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Quatrocentos jogos, <span class="it">compostos</span> como uma <span class="u">revista impressa.</span></h1>
    <div class="hero-rules">
      <div class="hstat hot"><b>400</b><span>jogos originais</span></div>
      <div class="hstat"><b>14</b><span>gêneros</span></div>
      <div class="hstat"><b id="stPlayed">0</b><span>jogados por você</span></div>
      <div class="hstat"><b id="stDone">0</b><span>concluídos</span></div>
      <div class="hstat"><b id="stPct">0%</b><span>da coleção</span></div>
    </div>
  </section>

  <section class="toolbar" aria-label="Busca e filtros">
    <div class="searchrow">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Buscar por nome, gênero ou mecânica… (ex: laser, poker, vulcão)" aria-label="Buscar jogo">
      </label>
      <div class="seg" role="tablist" aria-label="Coleção">
        <button data-tab="all" class="on">Tudo</button>
        <button data-tab="fav">★ Favoritos</button>
        <button data-tab="todo">○ A jogar</button>
        <button data-tab="done">● Concluídos</button>
      </div>
      <select class="sort" id="sort" aria-label="Ordenar">
        <option value="num">Ordenar: Nº da peça</option>
        <option value="name">Ordenar: A–Z</option>
        <option value="diff">Ordenar: Dificuldade</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="resultline"><span id="countLine">// EXIBINDO 400 / 400 JOGOS</span><span>PROGRESSO SALVO NESTE NAVEGADOR_</span></div>
  </section>

  <section class="grid" id="grid" aria-label="Jogos"></section>

  <footer class="site">
    <span><b>NCODE N</b> · OFICINA DE JOGOS</span>
    <span>400/400 PEÇAS</span>
  </footer>
</main>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
