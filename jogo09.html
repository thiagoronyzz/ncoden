<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jogo 09 · Antiquário — JogoZ</title>
<style>
  :root{--bg:#14100b;--panel:#1e1710;--line:#3d3120;--txt:#f2ead9;--mut:#b3a184;--ac:#d9b45e;--ok:#7ddb9e;--bad:#f08a6d;--gold:#ffd166;--wood:#8a5a2b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;background:radial-gradient(900px 420px at 85% -10%,rgba(217,180,94,.1),transparent 55%),linear-gradient(180deg,var(--bg),#0a0805);color:var(--txt);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(20,16,11,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .top a{color:var(--ac);text-decoration:none;font-weight:700;font-size:14px;padding:6px 10px;border-radius:8px;display:flex;gap:5px}
  .top a:hover{background:rgba(217,180,94,.1)}
  .ttl{font-weight:800}
  .sp{flex:1}
  .btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--ac)}
  .wrap{max-width:1180px;margin:0 auto;padding:14px}
  .hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:14px}
  .hud .it{font-size:13.5px;color:var(--mut)}
  .hud b{color:#fff}
  .gold{color:var(--gold);font-weight:800}
  .daybt{margin-left:auto}
  .sec{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:1000px){.sec{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .item{background:#171208;border:1px solid #4a3b22;border-radius:13px;padding:12px;position:relative;overflow:hidden}
  .item .ico{font-size:34px}
  .item h4{font-size:14.5px;margin:4px 0 2px}
  .item .era{font-size:11px;color:var(--mut)}
  .item .cond{font-size:11px;color:var(--ac)}
  .item .price{color:var(--gold);font-weight:800;font-size:15px}
  .item .clue{font-size:12px;color:#cfc0a2;line-height:1.5;margin:6px 0;min-height:34px}
  .item .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .mi{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#221b10;color:var(--txt);font-size:12px;font-weight:600}
  .mi:hover{border-color:var(--ac)}
  .mi.go{background:linear-gradient(135deg,#d9b45e,#8a6a2f);color:#140f03;border:0}
  .mi:disabled{opacity:.4;cursor:not-allowed}
  .invItem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 11px;margin-bottom:7px;background:#171208}
  .invItem .info{flex:1;font-size:13px}
  .invItem .info b{display:block}
  .invItem .info small{color:var(--mut)}
  .offerbox{border:1px dashed var(--ac);background:rgba(217,180,94,.07);border-radius:10px;padding:8px 11px;margin-top:6px;font-size:12.5px;color:#e6d6ae}
  .offerbox b{color:var(--gold)}
  .log{font-size:12.5px;line-height:1.55;margin-top:10px}
  .log div{padding:5px 0;border-bottom:1px dashed #33291c;color:#cbbc98}
  .log .ok{color:var(--ok)}.log .bad{color:var(--bad)}.log .g{color:var(--ac)}
  .bigmsg{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.87);z-index:80;padding:16px}
  .bigmsg.open{display:grid}
  .res{background:linear-gradient(160deg,#241c10,#151007);border:1px solid var(--ac);border-radius:18px;max-width:560px;width:100%;padding:24px;max-height:88vh;overflow:auto}
  .res h2{margin-bottom:8px}
  .res p{line-height:1.65;font-size:13.5px;color:#e8dcc2;margin:7px 0}
  .rowB{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .tier{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--ac);color:var(--ac);letter-spacing:1px;text-transform:uppercase}
  .star{color:var(--gold)}
  @media(max-width:700px){.daybt{margin-left:0;width:100%}.daybt button{width:100%}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html">← JogoZ</a><span class="ttl">09 · Antiquário</span><span class="sp"></span>
  <button class="btn" id="helpBtn">Manual</button>
  <button class="btn" id="rstBtn">Recomeçar loja</button>
</header>
<div class="wrap">
  <div class="hud">
    <span class="it">Caixa: <b class="gold" id="cash">0</b></span>
    <span class="it">Dia: <b id="day">1</b>/10</span>
    <span class="it">Meta: <b style="color:var(--gold)" id="goal">0</b></span>
    <span class="it">Prateleiras: <b id="invN">0</b>/6</span>
    <span class="it">Reputação: <span id="rep">⭐</span></span>
    <span class="daybt"><button class="btn" id="endBtn" style="background:var(--ac);color:#140f03;font-weight:800;border:0">Encerrar o dia →</button></span>
  </div>
  <div class="sec">
    <div class="panel">
      <h3>Chegadas de hoje</h3>
      <div class="items" id="items"></div>
    </div>
    <div class="panel">
      <h3>Seu estoque</h3>
      <div id="inventory"></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>
<div class="bigmsg" id="big"><div class="res" id="resBox"></div></div>
<script>
"use strict";
let AC=null;
function tone(f,d,type,g,when){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(when||0),o=AC.createOscillator(),v=AC.createGain();o.type=type||'square';o.frequency.value=f;v.gain.value=g||.04;o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d);o.onended=function(){o.disconnect();v.disconnect();};}catch(e){}}
function sfx(k){if(k==='ok'){tone(660,.09,'square',.05);tone(990,.13,'square',.05,.08);}else if(k==='bad')tone(190,.2,'sawtooth',.05);else if(k==='click')tone(500,.04,'square',.03);else if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.14,'square',.05,i*.11));}else if(k==='coin')tone(900,.06,'square',.05);}
document.addEventListener('pointerdown',function(){if(AC&&AC.state==='suspended')AC.resume();},{once:true});
const PREF='jzP09';
function load(){try{const v=localStorage.getItem(PREF);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(PREF,JSON.stringify({played:true,best:best,win:st?st.win:false}));}catch(e){}}
let best=0;
(function(){const s=load();if(s)best=s.best||0;})();

/* ===== base de objetos: tier 1 simples · tier 2 médio · tier 3 caro ===== */
const BASE=[
 {n:'Cadeira de balanço',t:1,era:'c. 1890',ic:'🪑',ask:[180,340],cond:['boa','gasta'],
  clue:'Entalhe simples, junções com cavilhas de época. Sem marcas de restauro recente.',
  paid:'A madeira é carvalho maciço; a fixação traseira é original — bom sinal de autenticidade.',
  kinds:[{k:0,w:2,mult:1.8},{k:1,w:1,mult:3.4},{k:2,w:1.4,mult:.12}]},
 {n:'Máquina de costura',t:1,era:'1910',ic:'🧵',ask:[220,420],cond:['boa','enferrujada'],
  clue:'Número de série baixo. Algumas peças cromadas foram repostas em algum momento.',
  paid:'O mecanismo interno tem a gravação da fábrica original — as peças cromadas são as únicas trocadas.',
  kinds:[{k:0,w:2,mult:1.7},{k:2,w:1.6,mult:.1},{k:1,w:1,mult:2.6}]},
 {n:'Espelho de mão de prata',t:1,era:'séc. XIX',ic:'🪞',ask:[120,260],cond:['pátina','boa'],
  clue:'Selo de ourives apagado. Peso um pouco leve para prata maciça.',
  paid:'O exame mostra camada de prata sobre latão — é banho, não prata maciça.',
  kinds:[{k:2,w:1.8,mult:.08},{k:0,w:1.6,mult:1.9},{k:1,w:1,mult:3}]},
 {n:'Relógio de parede',t:1,era:'c. 1900',ic:'🕰️',ask:[300,520],cond:['funciona','parado'],
  clue:'Pêndulo original com marca registrada. A caixa pode ter sido repintada.',
  paid:'O movimento é alemão de época e a caixa mantém a pátina antiga sob a repintura leve.',
  kinds:[{k:0,w:2,mult:2},{k:1,w:1,mult:3.2},{k:2,w:1.2,mult:.15}]},
 {n:'Bule de porcelana',t:1,era:'início séc. XX',ic:'🫖',ask:[150,300],cond:['inteiro','trincado'],
  clue:'Marca azul sob o vidrado. O bico foi colado e repintado.',
  paid:'Trinca invisível no corpo reduz o valor, mas a porcelana é original da fábrica.',
  kinds:[{k:0,w:2.4,mult:1.6},{k:1,w:.8,mult:2.8},{k:2,w:1.2,mult:.1}]},
 {n:'Livro de capa de couro',t:1,era:'1888',ic:'📕',ask:[90,220],cond:['bom','desgastado'],
  clue:'Folha de rosto com data de 1888. Lombada parece nova demais.',
  paid:'Reencadernação recente; o miolo é da época — exemplar honesto, sem grande valor.',
  kinds:[{k:0,w:2.4,mult:1.4},{k:2,w:1.5,mult:.08},{k:1,w:.7,mult:2.5}]},
 {n:'Luminária de bronze',t:2,era:'art déco 1925',ic:'💡',ask:[700,1300],cond:['boa','oxidação'],
  clue:'Desenho geométrico típico. A base tem parafusos de reposição.',
  paid:'Fundição pesada e assinatura do ateliê L. Moreau na base — exemplar de colecionador.',
  kinds:[{k:1,w:1.2,mult:3.6},{k:0,w:1.8,mult:2},{k:2,w:1.4,mult:.1}]},
 {n:'Baú de couro de viagem',t:2,era:'séc. XIX',ic:'🧳',ask:[600,1200],cond:['desgastado','restaurado'],
  clue:'Etiquetas de hotéis europeus coladas. O couro está ressecado.',
  paid:'O couro é original e as etiquetas são da época — colecionadores de viagem pagam bem.',
  kinds:[{k:0,w:2,mult:2.2},{k:1,w:1,mult:3.4},{k:2,w:1.3,mult:.12}]},
 {n:'Conjunto de jantar (12 peças)',t:2,era:'c. 1900',ic:'🍽️',ask:[900,1700],cond:['completo','faltando 2'],
  clue:'Louça com filete dourado. O dourado saiu em algumas bordas.',
  paid:'Marca da fábrica Vista Alegre presente e padrão raro — conjunto quase completo valoriza.',
  kinds:[{k:0,w:2,mult:2},{k:1,w:1.4,mult:3.2},{k:2,w:1.3,mult:.1}]},
 {n:'Rádio valvulado',t:2,era:'1948',ic:'📻',ask:[500,950],cond:['não liga','funciona'],
  clue:'Design “catedral” clássico. A madeira foi encerada recentemente.',
  paid:'As válvulas são originais da fábrica Philco; o gabinete só ganhou cera nova.',
  kinds:[{k:0,w:2.4,mult:1.9},{k:1,w:.9,mult:3},{k:2,w:1.2,mult:.12}]},
 {n:'Quadro a óleo (paisagem)',t:2,era:'séc. XIX',ic:'🖼️',ask:[800,1600],cond:['bom','sujo'],
  clue:'Sem assinatura visível. A moldura parece mais nova que a tela.',
  paid:'A craquelê do verniz indica idade real; a tela é de escola francesa de paisagem.',
  kinds:[{k:1,w:1.3,mult:3.8},{k:0,w:1.8,mult:1.9},{k:2,w:1.4,mult:.15}]},
 {n:'Sérvia de escritório',t:2,era:'1800',ic:'🖋️',ask:[700,1400],cond:['boa','riscada'],
  clue:'Brasão gravado na tampa. O tinteiro interno está rachado.',
  paid:'Prata de lei com marcas de contraste completas — o brasão é de uma família nobre local.',
  kinds:[{k:1,w:1.4,mult:3.5},{k:0,w:1.7,mult:2.1},{k:2,w:1.3,mult:.1}]},
 {n:'Cristaleira',t:3,era:'séc. XVIII',ic:'🚪',ask:[2600,4600],cond:['original','retocada'],
  clue:'Marcas de serra manual nos encaixes. Os puxadores são de reposição.',
  paid:'Dendrocronologia confirma madeira do século XVIII — peça de museu em bom estado.',
  kinds:[{k:1,w:1.5,mult:3.6},{k:0,w:1.5,mult:2.3},{k:2,w:1.3,mult:.08}]},
 {n:'Escultura de marfim vegetal',t:3,era:'séc. XIX',ic:'🗿',ask:[2000,3800],cond:['ótimo','rachada'],
  clue:'Material leve e quente ao toque. Base de madeira nova.',
  paid:'É tagua (marfim vegetal), esculpida à mão no período — lícita e valiosa.',
  kinds:[{k:1,w:1.4,mult:3.2},{k:0,w:1.7,mult:2.2},{k:2,w:1.4,mult:.14}]},
 {n:'Globo terrestre (1680)',t:3,era:'1680',ic:'🌍',ask:[4000,7000],cond:['restaurado','frágil'],
  clue:'Papel com marcas d’água antigas. A esfera foi limpa e estabilizada.',
  paid:'Cartografia holandesa original; a restauração foi conservadora e documentada.',
  kinds:[{k:1,w:1.6,mult:3.4},{k:0,w:1.4,mult:2.2},{k:2,w:1.4,mult:.06}]},
 {n:'Piano de armário',t:3,era:'c. 1900',ic:'🎹',ask:[3200,5600],cond:['afinado','desafinado'],
  clue:'Fabricante pouco conhecido. A tábua harmônica tem uma trinca reparada.',
  paid:'A trinca foi bem reparada e o mecanismo é original — pianos de armário voltaram à moda.',
  kinds:[{k:0,w:2.2,mult:1.9},{k:1,w:1.1,mult:2.8},{k:2,w:1.3,mult:.1}]},
 {n:'Colar de âmbar',t:3,era:'séc. XIX',ic:'📿',ask:[1500,2900],cond:['ótimo','opaco'],
  clue:'Contas leves, com inclusões. O fecho é moderno.',
  paid:'Teste de eletricidade estática positivo — âmbar báltico verdadeiro, contas antigas.',
  kinds:[{k:1,w:1.5,mult:3.1},{k:0,w:1.6,mult:2},{k:2,w:1.4,mult:.12}]}];
const KINDN=['AUTÊNTICO COMUM','RARO VERDADEIRO','RÉPLICA / FALSO'];
function rnd(a){return Math.random();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let st=null,cash=0,day=1,inv=[],today=[],logA=[],tier=1;
function newGame(){
  st={win:false};cash=1500;day=1;inv=[];tier=1;logA=[];
  logx('🧾 Loja reaberta com 1.500 M no caixa. Meta: chegar a 8.000 M em 10 dias.','g');
  startDay();
}
function tierForCash(){
  if(cash>=9500)return 3;if(cash>=4500)return 2;return 1;
}
function startDay(){
  tier=tierForCash();
  today=[];
  const pool=BASE.filter(b=>b.t<=tier||(tier===3));
  const chosen=shuffle(pool).slice(0,4);
  chosen.forEach(b=>{
    const ask=Math.round((b.ask[0]+Math.random()*(b.ask[1]-b.ask[0]))/5)*5;
    // kind sorteado com pesos
    const tot=b.kinds.reduce((a,k)=>a+k.w,0);let r=Math.random()*tot;
    let kind=b.kinds[0].k;
    for(const k of b.kinds){r-=k.w;if(r<=0){kind=k.k;break;}}
    const trueV=Math.round(b.ask[1]*0.55*kind===0?b.kinds.find(x=>x.k===kind).mult:1);
    const mult=b.kinds.find(x=>x.k===kind).mult;
    const baseV=Math.round(((b.ask[0]+b.ask[1])/2)*mult);
    today.push({base:b,ask,kind,trueV:baseV,insp:false,hag:0});
  });
  if(day>1)logx('☀️ Dia '+day+' — novas peças chegaram à loja.','');
  renderAll();
}
function buy(i){
  const it=today[i];
  if(!it)return;
  if(cash<it.ask){logx('Caixa insuficiente.','bad');sfx('bad');return;}
  if(inv.length>=6){logx('Prateleiras cheias — venda algo antes.','bad');return;}
  cash-=it.ask;inv.push({b:it.base,kind:it.kind,trueV:it.trueV,paid:it.ask,restored:false});
  sfx('coin');
  logx('🛒 Comprou “'+it.base.n+'” por '+it.ask+' M.','');
  today.splice(i,1);
  renderAll();
}
function inspect(i){
  const it=today[i];if(!it||it.insp)return;
  const cost=Math.max(30,Math.round(it.ask*0.12/5)*5);
  if(cash<cost){logx('Sem caixa para a inspeção.','bad');return;}
  cash-=cost;it.insp=true;sfx('ok');
  logx('🔬 Inspeção de “'+it.base.n+'” ('+cost+' M): '+it.base.paid,'');
  renderAll();
}
function haggle(i){
  const it=today[i];if(!it)return;
  if(it.hag>=3)return;
  const disc=it.base.ask[0]*0.05;
  if(cash<0)return;
  it.ask=Math.max(it.base.ask[0]*0.6,Math.round((it.ask-disc)/5)*5);
  it.hag++;
  sfx('click');
  logx('🗣 Regateio: novo pedido de '+it.ask+' M.','');
  renderAll();
}
function restore(ii){
  const it=inv[ii];if(!it||it.restored)return;
  const cost=Math.max(40,Math.round(it.trueV*0.08/5)*5);
  if(cash<cost){logx('Sem caixa para restauro.','bad');return;}
  cash-=cost;it.restored=true;sfx('ok');
  const gain=it.kind===1?1.3:it.kind===0?1.12:0.8;
  it.trueV=Math.round(it.trueV*gain);
  logx('🔨 Restauro de “'+it.b.n+'” (+'+(it.kind===2?'risco de perda no falso':' valor')+').','');
  renderAll();
}
function sell(ii){
  const it=inv[ii];if(!it)return;
  // oferta de colecionador com ruído
  const v=it.trueV*(0.9+Math.random()*0.25);
  const offer=Math.round(v);
  inv.splice(ii,1);cash+=offer;sfx('coin');
  const ok=offer>=it.paid*1.1;
  logx((ok?'✅':'😞')+' Vendeu “'+it.b.n+'” por '+offer+' M. '+KINDN[it.kind]+'.',ok?'ok':'bad');
  renderAll();
}
function endDay(){
  if(inv.length>=6){logx('Estoque cheio: venda ou restaure antes de fechar.','bad');sfx('bad');return;}
  if(day>=10){endGame();return;}
  day++;renderAll();
}
function endGame(){
  const ok=cash>=8000;
  st.win=ok;
  const score=Math.round(cash/10)+ (ok?400:0);
  if(score>best){best=score;}
  save();sfx(ok?'win':'bad');
  document.getElementById('resBox').innerHTML=
    '<h2 style="color:'+(ok?'var(--ok)':'var(--bad)')+'">'+(ok?'🏆 Dia 10 — você virou referência no bairro!':'Fim dos 10 dias')+'</h2>'+
    '<p>Caixa final: <b class="gold">'+cash+' M</b> · meta: 8.000 M.</p>'+
    '<p>Pontuação: <b>'+score+'</b>'+(score>=best?' · recorde!':' · recorde '+best)+'</p>'+
    '<p style="font-size:12.5px;color:var(--mut)">Dica: réplicas e “restauros recentes” parecem ótimos negócios no balcão. Inspecione antes de comprar e restaure só o que for verdadeiro.</p>'+
    '<div class="rowB"><button class="btn" style="background:var(--ac);color:#140f03;font-weight:800;border:0" onclick="restart()">Abrir nova loja</button><button class="btn" onclick="closeBig()">Ver histórico</button></div>';
  document.getElementById('big').classList.add('open');
}
function restart(){document.getElementById('big').classList.remove('open');newGame();}
function closeBig(){document.getElementById('big').classList.remove('open');}
function logx(m,c){logA.unshift('<div class="'+(c||'')+'">'+m+'</div>');const e=document.getElementById('log');e.innerHTML=logA.slice(0,40).join('');}
function renderAll(){
  if(!st)return;
  document.getElementById('cash').textContent=cash;
  document.getElementById('day').textContent=Math.min(day,10);
  document.getElementById('goal').textContent=8000;
  document.getElementById('invN').textContent=inv.length;
  document.getElementById('rep').textContent='⭐'.repeat(tier)+' '.repeat(Math.max(0,3-tier)).replace(/ /g,'·');
  // itens de hoje
  const box=document.getElementById('items');box.innerHTML='';
  if(!today.length){box.innerHTML='<div style="color:var(--mut);font-size:13px;grid-column:1/-1">Nada na vitrine hoje.</div>';}
  today.forEach((it,i)=>{
    const d=document.createElement('div');
    d.className='item';
    const locked=cash<it.ask;
    d.innerHTML='<div class="ico">'+it.base.ic+'</div><h4>'+it.base.n+'</h4>'+
      '<div class="era">'+it.base.era+' · estado: '+it.base.cond[Math.floor(day%2)]+'</div>'+
      '<div class="price">'+it.ask+' M</div>'+
      '<div class="clue">'+(it.insp?('<span style="color:var(--ok)">🔬 '+it.base.paid+'</span>'):it.base.clue)+'</div>'+
      '<div class="row2">'+
      '<button class="mi" onclick="buy('+i+')" '+(locked?'disabled':'')+'>Comprar</button>'+
      '<button class="mi" onclick="inspect('+i+')" '+(it.insp?'disabled':'')+'>🔬 Inspecionar</button>'+
      '<button class="mi" onclick="haggle('+i+')" '+(it.hag>=3?'disabled':'')+'>Regatear</button></div>';
    box.appendChild(d);
  });
  // estoque
  const iv=document.getElementById('inventory');iv.innerHTML='';
  if(!inv.length){iv.innerHTML='<div style="color:var(--mut);font-size:13px">Seu estoque está vazio. Compre barato, venda pelo valor certo.</div>';}
  inv.forEach((it,i)=>{
    const d=document.createElement('div');
    d.className='invItem';
    d.innerHTML='<div class="ico" style="font-size:24px">'+it.b.ic+'</div>'+
      '<div class="info"><b>'+it.b.n+'</b><small>pago '+it.paid+' M'+(it.restored?' · restaurado':'')+'</small>'+
      '<div class="offerbox">Oferta de colecionador agora: <b>~'+Math.round(it.trueV)+' M</b></div></div>'+
      '<div class="row2">'+
      '<button class="mi" onclick="restore('+i+')" '+(it.restored?'disabled':'')+'>Restaurar</button>'+
      '<button class="mi go" onclick="sell('+i+')">Vender</button></div>';
    iv.appendChild(d);
  });
}
document.getElementById('endBtn').addEventListener('click',endDay);
document.getElementById('rstBtn').addEventListener('click',restart);
document.getElementById('helpBtn').addEventListener('click',()=>{sfx('click');
  document.getElementById('resBox').innerHTML='<h2 style="color:var(--ac)">Como jogar</h2>'+
  '<p>Objetos chegam todos os dias. Alguns são <b>autênticos comuns</b> (lucro pequeno), outros são <b>raros verdadeiros</b> (lucro grande) e muitos são <b>réplicas/falsificações</b> que parecem ótimos negócios.</p>'+
  '<p><b>Inspecione</b> antes de comprar (custa ~12% do pedido) para revelar a verdade. <b>Regateie</b> o preço. <b>Restaure</b> só peças verdadeiras para aumentar o valor.</p>'+
  '<p>Meta: chegar a <b>8.000 M</b> em 10 dias. Com caixa maior, fornecedores de peças raras (tiers 2 e 3) começam a te procurar.</p>'+
  '<div class="rowB"><button class="btn" style="background:var(--ac);color:#140f03;font-weight:800;border:0" onclick="closeBig()">Entendi</button></div>';
  document.getElementById('big').classList.add('open');
});
newGame();
</script>
</body>
</html>
