<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jogo 08 · Casa de Leilões — JogoZ</title>
<style>
  :root{--bg:#100d08;--panel:#1a150c;--line:#3b2f18;--txt:#f1e8d4;--mut:#a8935f;--ac:#e8c46a;--ok:#74d99f;--bad:#ff8a7a;--blu:#9ab8ff;--gold:#ffd166}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;background:radial-gradient(900px 420px at 85% -10%,rgba(232,196,106,.12),transparent 60%),linear-gradient(180deg,var(--bg),#080604);color:var(--txt);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(16,13,8,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .top a{color:var(--ac);text-decoration:none;font-weight:700;font-size:14px;padding:6px 10px;border-radius:8px;display:flex;gap:5px}
  .top a:hover{background:rgba(232,196,106,.1)}
  .ttl{font-weight:800}
  .sp{flex:1}
  .btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--ac)}
  .wrap{max-width:1120px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
  .money{font-size:15px;font-weight:800;color:var(--gold)}
  .lot{border:1px solid #57441f;border-radius:16px;background:linear-gradient(160deg,#231c0e,#161109);padding:16px;margin-bottom:10px}
  .lot .ttl2{font-size:20px;font-weight:800}
  .lot .est{color:var(--mut);font-size:13px;margin:3px 0 8px}
  .lot .desc{font-size:14px;line-height:1.65;color:#e4d9ba}
  .lot .desc b{color:var(--ac)}
  .bidArea{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .bidBtn{padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:#221b0e;color:var(--txt);font-weight:700}
  .bidBtn:hover{border-color:var(--ac)}
  .bidBtn:disabled{opacity:.35;cursor:not-allowed}
  .bidBtn.go{background:linear-gradient(135deg,#e8c46a,#8a6a2f);color:#120e02;border:0}
  .bidBtn.pass{background:#2a2113;color:var(--bad)}
  .feed{max-height:200px;overflow:auto;font-size:12.5px;line-height:1.5;margin-top:10px}
  .feed div{padding:4px 2px;border-bottom:1px dashed #3a2f1a}
  .feed .p{color:#d8c188}.feed .you{color:var(--ac);font-weight:700}.feed .win{color:var(--ok)}.feed .bad{color:var(--bad)}
  .npc{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#12100a}
  .npc b{color:#ffe9a8}
  .npc .per{font-size:11px;color:var(--mut);display:block}
  .npc .inf{font-size:12px;color:#cbbb8c;margin-top:3px}
  .npc .bar{height:6px;border-radius:4px;background:#33291a;margin-top:6px;overflow:hidden}
  .npc .bar i{display:block;height:100%;background:var(--ac)}
  .pl{color:var(--gold);font-weight:800}
  .bigmsg{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.86);z-index:80;padding:16px}
  .bigmsg.open{display:grid}
  .res{background:linear-gradient(160deg,#231c0e,#141008);border:1px solid var(--ac);border-radius:18px;max-width:560px;width:100%;padding:24px;max-height:88vh;overflow:auto}
  .res h2{margin-bottom:8px}
  .res p{line-height:1.65;font-size:13.5px;color:#e7dcc0;margin:7px 0}
  .res .val{font-size:30px;color:var(--gold);font-weight:900}
  .rowB{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .reveal{display:flex;gap:10px;margin:8px 0}
  .bubble{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .bubble b{display:block;font-size:18px}
  .bubble small{color:var(--mut)}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html">← JogoZ</a><span class="ttl">08 · Casa de Leilões</span><span class="sp"></span>
  <span style="font-size:13px;color:var(--mut)">Lote <b id="lotNo" style="color:#fff">1</b>/8 · Orçamento: <b style="color:var(--gold)" id="budTop">0</b></span>
  <button class="btn" id="helpBtn">Manual</button>
  <button class="btn" id="rstBtn">Reiniciar pregão</button>
</header>
<div class="wrap">
  <main>
    <div class="panel" id="lotPanel"></div>
    <div class="panel" style="margin-top:12px">
      <h3>Movimento do leilão</h3>
      <div class="feed" id="feed"></div>
    </div>
  </main>
  <aside>
    <div class="panel">
      <h3>Seu salão</h3>
      <div style="font-size:13px;color:var(--mut)">Orçamento: <span class="money" id="budget">0</span><br>
      Lotes arrematados: <b id="wins">0</b> · Gasto: <span style="color:var(--bad)" id="spent">0</span></div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h3>Concorrentes</h3>
      <div id="npcs"></div>
    </div>
  </aside>
</div>
<div class="bigmsg" id="big"><div class="res" id="resBox"></div></div>
<script>
"use strict";
let AC=null;
function tone(f,d,type,g,when){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(when||0),o=AC.createOscillator(),v=AC.createGain();o.type=type||'square';o.frequency.value=f;v.gain.value=g||.04;o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d);o.onended=function(){o.disconnect();v.disconnect();};}catch(e){}}
function sfx(k){if(k==='ok'){tone(640,.09,'square',.05);tone(960,.14,'square',.05,.08);}else if(k==='bad')tone(200,.22,'sawtooth',.05);else if(k==='click')tone(480,.04,'square',.03);else if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.15,'square',.05,i*.11));}else if(k==='gavel')tone(900,.07,'square',.06);}
document.addEventListener('pointerdown',function(){if(AC&&AC.state==='suspended')AC.resume();},{once:true});
const PREF='jzP08';
function load(){try{const v=localStorage.getItem(PREF);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(PREF,JSON.stringify({played:true,best:best,win:state?state.win:false}));}catch(e){}}
let best=0;
(function(){const s=load();if(s)best=s.best||0;})();

/* Lotes: kind 0 comum · 1 raro · 2 falsificação. market = multiplicador do valor "avaliado" */
const POOL=[
 {n:'Relógio de bolso “Le Roy”',est:900,hint:'Procede de uma coleção famosa… mas existem muitas réplicas da década de 70.',kind:2,mult:.05},
 {n:'Cadeira D. Maria (séc. XVIII)',est:1200,hint:'Marcação de entalhador presente; restauro antigo preservado.',kind:1,mult:3.2},
 {n:'Conjunto de talheres de prata',est:700,hint:'Selo de ourives legível com dificuldade; teste do ímã não reagiu.',kind:0,mult:1.7},
 {n:'Mapa-múndi de 1640',est:1500,hint:'Papel com marca d’água da época. O vendedor pede pagamento em espécie.',kind:2,mult:.03},
 {n:'Espelho veneziano biselado',est:1100,hint:'Bisel irregular típico de oficina pequena do século XIX.',kind:1,mult:2.9},
 {n:'Baú de viagem com ferragens',est:500,hint:'Interior forrado com jornal de 1912 — data confere com o estilo.',kind:0,mult:1.5},
 {n:'Escultura de bronze “Pássaro”',est:2000,hint:'Assinatura de fundidor conhecido, mas o peso está leve demais.',kind:2,mult:.06},
 {n:'Jogo de chá de porcelana',est:800,hint:'Marca da fábrica real presente e vidrado uniforme.',kind:0,mult:1.8},
 {n:'Luneta de navegação',est:950,hint:'Latão com pátina natural; lentes de aumento sem bolhas.',kind:1,mult:2.6},
 {n:'Poltrona art déco',est:600,hint:'Estofamento trocado nos anos 60; estrutura original.',kind:0,mult:1.6},
 {n:'Violino “escola cremonesa”',est:3200,hint:'Rótulo interno diz Stradivarius — o que já é um mau sinal.',kind:2,mult:.04},
 {n:'Cofre de marinheiro',est:1300,hint:'Fechadura complexa intacta e ferrugem apenas superficial.',kind:1,mult:2.7},
 {n:'Bússola de bolso',est:300,hint:'Funciona; caixa de latão com pequena amolgadura.',kind:0,mult:1.4},
 {n:'Manto cerimonial bordado',est:1800,hint:'Fios de ouro verdadeiros? O exame de laboratório é caro mas decide.',kind:2,mult:.08},
 {n:'Cristaleira com espelho',est:2200,hint:'Marcas de serra manual no encaixe: época correta.',kind:1,mult:2.5},
 {n:'Armário de farmácia (1900)',est:750,hint:'Vidros originais com bolhas; portinhola com trinco de latão.',kind:0,mult:1.55}];
const RIVALS=[
 {id:'ag',n:'Sr. Agnelo',per:'AGGRESSIVE — dispara lances altos e odeia perder. Tendência a superestimar.',lim:1.15,infl:1.0,persist:.75},
 {id:'ve',n:'Dona Verônica',per:'CONSERVATIVE — só paga perto do valor justo e desiste cedo.',lim:0.95,infl:.5,persist:.2},
 {id:'ju',n:'Juca Borges',per:'BLUFFER — levanta o preço para assustar os outros e cai fora na última hora. Às vezes se queima.',lim:.7,infl:1.4,persist:.35}];
let budget=5000,lots=[],li=0,price=0,inAuction=false,feed=[],wins=0,spent=0,curr=null,activeR=null,state=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newRun(){
  state={win:false};
  budget=5000;wins=0;spent=0;li=0;
  lots=shuffle(POOL.slice()).slice(0,8);
  feed=[];inAuction=false;
  nextLot();
}
function lotTrue(l){
  // valor de mercado oculto
  const v=l.est*l.mult*(0.9+Math.random()*0.2);
  return v;
}
function npcLimit(npc,l){return l.est*npc.lim*(0.85+Math.random()*0.3);}
function logF(msg,cls){feed.unshift('<div class="'+(cls||'')+'">'+msg+'</div>');document.getElementById('feed').innerHTML=feed.slice(0,50).join('');}
function nextLot(){
  document.getElementById('big').classList.remove('open');
  if(li>=lots.length){endRun();return;}
  curr=lots[li];
  price=Math.floor(curr.est*0.45);
  inAuction=true;
  activeR=RIVALS.map(r=>{const lim=npcLimit(r,curr);return {id:r.id,lim,inf:r.infl,pers:r.persist,folded:false};});
  logF('🔨 Lote '+(li+1)+': “'+curr.n+'” — abertura em '+price+' M.','');
  renderAll();
}
function playerBid(){
  if(!inAuction)return;
  if(price+25>budget){logF('Você não tem orçamento para cobrir este lance.','bad');return;}
  price+=25;logF('Você dá lance: <b>'+price+' M</b>','you');sfx('click');
  afterPlayerMove();
}
function playerPass(){if(!inAuction)return;logF('Você passa.','');sfx('bad');resolveAuction(false);}
function afterPlayerMove(){
  // rivais respondem
  RIVALS.forEach((r,idx)=>{
    const a=activeR[idx];
    if(a.folded||inAuction===false)return;
    if(price>=a.lim){
      // perto do limite: agressivo às vezes continua, blefador foge
      const rnd=Math.random();
      if(r.id==='ag'&&rnd<a.pers&&price<a.lim*1.25){raise(idx,'mantém-se firme apesar do preço alto');}
      else if(r.id==='ju'&&rnd>a.pers*0.9){raise(idx,'levanta mais uma vez (blefe?)');}
      else if(r.id==='ve'&&rnd<0.1){raise(idx,'relutantemente cobre');}
      else{a.folded=true;logF('— '+r.n+' desiste.','');}
    }else{
      // dentro do limite: probabilidade de dar +25
      if(Math.random()<0.55+(a.inf-1)*0.2){raise(idx,'dá lance');}
    }
  });
  const left=activeR.filter(a=>!a.folded).length;
  if(left===0)resolveAuction(true);
  renderAll();
}
function raise(idx,msg){
  if(!inAuction)return;
  price+=25;const r=RIVALS[idx];
  logF('+ '+r.n+' '+msg+': <b>'+price+' M</b>','p');sfx('click');
}
function resolveAuction(youWin){
  if(!inAuction)return;
  inAuction=false;
  if(youWin){
    if(price>budget){logF('⚠ Lance acima do orçamento anulado.','bad');renderAll();setTimeout(()=>{nextLot();},300);return;}
    wins++;spent+=price;budget-=price;
    const win=lotTrue(curr);
    logF('🔨 Arrematado por VOCÊ: '+price+' M.','win');sfx('gavel');
    setTimeout(()=>reveal(price,win,true),400);
  }else{
    // a concorrência segue disputando entre si e leva o lote
    const left=activeR.filter(a=>!a.folded);
    let extra=0;
    for(let i=0;i<Math.max(1,left.length-1);i++){
      price+=25;extra++;
      const who=left[i%left.length];
      logF('+ '+RIVALS.find(r=>r.id===who.id).n+' cobre: <b>'+price+' M</b>','p');
    }
    logF('Lote vendido à concorrência por '+price+' M.','');
    sfx('gavel');
    setTimeout(()=>reveal(null,null,false),500);
  }
}
function reveal(pay,val,youWin){
  const l=curr;
  const kindName=['COMUM','RARO','FALSIFICAÇÃO'][l.kind];
  const kc=['#a8935f','#ffd166','#ff8a7a'][l.kind];
  const trueV=youWin?val:lotTrue(l);
  const profit=youWin?Math.round(trueV-pay):0;
  if(youWin)sfx(profit>=0?'ok':'bad');
  const mx=document.getElementById('resBox');
  mx.innerHTML='<h2>“'+l.n+'”</h2>'+
   '<div style="font-size:15px;color:'+kc+';font-weight:800">'+kindName+'</div>'+
   '<p class="val">'+Math.round(trueV)+' M</p>'+
   (youWin?'<p>Você pagou <b>'+pay+' M</b> e a avaliação aponta valor de mercado de <b>'+Math.round(trueV)+' M</b>.</p>'+
     '<p style="font-size:16px;color:'+(profit>=0?'var(--ok)':'var(--bad)')+'">'+(profit>=0?'+':'−')+Math.abs(profit)+' M '+(profit>=0?'de lucro':'de prejuízo')+'</p>':
     '<p>O lote foi para outro salão. Pelo que se soube depois, o valor real era de cerca de <b>'+Math.round(trueV)+' M</b>.</p>')+
   '<p style="color:var(--mut);font-size:12.5px">'+(l.kind===2?'O catálogo dizia “possível atribuição” — quem comprou sem desconfiar pagou caro.':l.kind===1?'Detalhes discretos no catálogo entregavam a raridade.':'Objeto honesto, valor de mercado normal.')+'</p>'+
   '<div class="rowB"><button class="btn" style="background:var(--ac);color:#120e02;font-weight:800;border:0" onclick="proxLote()">Próximo lote →</button></div>';
  document.getElementById('big').classList.add('open');
  renderAll();
}
function proxLote(){li++;nextLot();}
function endRun(){
  const total=budget; // liquidez
  const meta=6200;
  const ok=total>=meta;
  state.win=ok;
  const score=Math.round(total)+wins*150;
  if(score>best){best=score;}
  save();
  sfx(ok?'win':'bad');
  document.getElementById('resBox').innerHTML=
    '<h2 style="color:'+(ok?'var(--ok)':'var(--bad)')+'">'+(ok?'🏆 Pregão encerrado com lucro!':'Fim do pregão')+'</h2>'+
    '<p>Orçamento final: <b class="pl">'+budget+' M</b> · Lotes arrematados: <b>'+wins+'</b>/8 · Gasto total: '+spent+' M</p>'+
    '<p>Meta da casa: terminar com <b>'+meta+' M</b> ou mais.</p>'+
    '<p>Pontuação: <b>'+score+'</b>'+(score>=best?' · <b style="color:var(--ac)">recorde!</b>':' · recorde '+best)+'</p>'+
    '<div class="rowB"><button class="btn" style="background:var(--ac);color:#120e02;font-weight:800;border:0" onclick="restart()">Novo pregão</button><button class="btn" onclick="closeBig()">Ver histórico</button></div>';
  document.getElementById('big').classList.add('open');
}
function restart(){document.getElementById('big').classList.remove('open');newRun();}
function closeBig(){document.getElementById('big').classList.remove('open');}
function renderAll(){
  document.getElementById('lotNo').textContent=Math.min(li+1,lots.length);
  document.getElementById('budTop').textContent=budget;
  document.getElementById('budget').textContent=budget;
  document.getElementById('wins').textContent=wins;
  document.getElementById('spent').textContent=spent;
  // lote panel
  const lp=document.getElementById('lotPanel');
  if(!curr){lp.innerHTML='<div style="color:var(--mut)">—</div>';return;}
  const left=activeR?activeR.filter(a=>!a.folded).length:0;
  lp.innerHTML='<div class="lot"><div class="ttl2">'+curr.n+'</div>'+
   '<div class="est">Lance inicial sugerido: '+Math.round(curr.est*0.45)+' M · avaliação de catálogo: ~'+curr.est+' M</div>'+
   '<div class="desc">'+curr.hint+'</div>'+
   '<div class="bidArea"><span style="color:var(--mut);font-size:14px">Lance atual: <b style="color:var(--gold);font-size:19px">'+price+' M</b></span>'+
     (inAuction?'<button class="bidBtn go" onclick="playerBid()">Dar lance (+25)</button>'+
     '<button class="bidBtn pass" onclick="playerPass()">Passar</button>'
     :'<span style="color:var(--mut)">Aguardando próximo lote…</span>')+'</div>'+
   '<div style="font-size:12px;color:var(--mut);margin-top:8px">Concorrentes ativos: '+left+'</div></div>';
  // npc panel
  const nb=document.getElementById('npcs');nb.innerHTML='';
  RIVALS.forEach((r,idx)=>{
    const a=activeR?activeR[idx]:null;
    const n=document.createElement('div');
    n.className='npc';
    n.innerHTML='<b>'+r.n+'</b> <span class="per">'+r.per+'</span>'+
      '<div class="inf">'+(a?'limite estimado: '+Math.round(a.lim)+' M · '+(a.folded?'✕ desistiu deste lote':'ainda no páreo'):'aguardando')+'</div>'+
      '<div class="bar"><i style="width:'+(a?Math.min(100,price/a.lim*100):0)+'%"></i></div>';
    nb.appendChild(n);
  });
}
function showHelp(){sfx('click');
  document.getElementById('resBox').innerHTML='<h2 style="color:var(--ac)">Como jogar</h2>'+
  '<p>Você tem <b>5.000 M</b> e oito lotes no pregão. Leia a <b>descrição</b>: o catálogo insinua a autenticidade — mas nem sempre é sincero.</p>'+
  '<p><b>Sr. Agnelo</b> paga caro e não desiste fácil; <b>Dona Verônica</b> para perto do valor justo; <b>Juca</b> infla o preço para te assustar e costuma desistir no fim.</p>'+
  '<p>Se você arrematar, a avaliação revela o valor real: <b>comum</b> rende um pouco, <b>raro</b> rende muito, <b>falsificação</b> derruba seu caixa.</p>'+
  '<p>Meta: terminar os 8 lotes com <b>6.200 M</b> ou mais. Passe quando o preço passar do valor provável.</p>'+
  '<div class="rowB"><button class="btn" style="background:var(--ac);color:#120e02;font-weight:800;border:0" onclick="closeBig()">Entendi</button></div>';
  document.getElementById('big').classList.add('open');
}
document.getElementById('helpBtn').addEventListener('click',showHelp);
document.getElementById('rstBtn').addEventListener('click',restart);
newRun();
</script>
</body>
</html>
