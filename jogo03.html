<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jogo 03 · Laboratório Caótico — JogoZ</title>
<style>
  :root{--bg:#080b0f;--panel:#0f141c;--line:#1e2b3a;--txt:#e6eef7;--mut:#7e92a6;--acc:#3ddc97;--acc2:#ffe08a;--rare:#ff5c8a;--rare2:#b06cff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;background:radial-gradient(900px 400px at 85% -10%,rgba(61,220,151,.1),transparent 55%),linear-gradient(180deg,var(--bg),#05070a);color:var(--txt);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(8,11,15,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .top a{color:var(--acc);text-decoration:none;font-weight:700;font-size:14px;padding:6px 10px;border-radius:8px;display:flex;gap:5px}
  .top a:hover{background:rgba(61,220,151,.1)}
  .ttl{font-weight:800}
  .sp{flex:1}
  .btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--acc)}
  .wrap{max-width:1180px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
  .slots{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .slot{width:72px;height:72px;border-radius:14px;border:2px dashed #2c3f52;display:grid;place-items:center;background:#0a0f16;font-size:11px;color:var(--mut);text-align:center;cursor:pointer;transition:all .15s;position:relative}
  .slot.filled{border-style:solid;border-color:var(--elc,var(--acc));color:var(--elc,var(--acc));font-weight:700;background:color-mix(in srgb,var(--elc,var(--acc)) 12%,transparent)}
  .slot .x{position:absolute;top:2px;right:6px;font-size:14px;opacity:.75}
  .slot.filled:hover .x{opacity:1}
  .mix{padding:10px 20px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--acc),#1e8f63);color:#04120c;font-weight:800;font-size:15px}
  .mix:disabled{filter:grayscale(.9);opacity:.5;cursor:not-allowed}
  .res{min-height:70px;margin-top:10px;padding:10px 12px;border-radius:12px;background:#0a1017;border:1px solid var(--line);font-size:13.5px;line-height:1.55;color:#c8d8e6}
  .res b{color:var(--acc2)}
  .res .new{color:var(--acc);font-weight:700}
  .res .rare{color:var(--rare2);font-weight:700}
  .bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-bottom:14px}
  .el{padding:10px 4px;border-radius:11px;background:#0b1119;border:1px solid var(--line);text-align:center;font-size:12px;color:var(--mut);cursor:pointer;transition:all .15s}
  .el:hover{border-color:var(--elc,var(--acc))}
  .el .ic{display:block;font-size:22px;margin-bottom:3px}
  .el.dis{opacity:.4;cursor:not-allowed}
  .qty{position:absolute;top:-7px;right:-7px;background:var(--elc,var(--acc));color:#04120c;font-size:10px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
  .book{max-height:66vh;overflow:auto}
  .ent{border-bottom:1px dashed #223247;padding:8px 2px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
  .ent .nm{display:flex;align-items:center;gap:8px}
  .ent .rs{color:var(--mut);font-size:12px}
  .hint{margin-top:10px;font-size:12px;color:var(--mut);line-height:1.5}
  .bigmsg{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.8);z-index:80;padding:16px}
  .bigmsg.open{display:grid}
  .res2{background:linear-gradient(160deg,#10161f,#0a0f16);border:1px solid var(--rare2);border-radius:18px;max-width:520px;width:100%;padding:26px;text-align:center}
  .res2 h2{font-size:24px;margin-bottom:8px}
  .res2 p{color:#d5e2ee;line-height:1.6;font-size:14px;margin:6px 0}
  .res2 .big{font-size:42px}
  .res2 b{color:var(--rare2)}
  .rowB{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .elem-badge{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--elc);background:color-mix(in srgb,var(--elc) 14%,#0a0f16);font-size:20px}
  .meter{height:8px;border-radius:6px;background:#1a2431;overflow:hidden;margin-top:5px}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--rare2),var(--rare));transition:width .3s}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}.book{max-height:40vh}}
</style>
</head>

function sfx(k){if(k==='ok'){tone(660,.08,'square',.05);tone(990,.13,'square',.05,.08);}else if(k==='bad')tone(190,.2,'sawtooth',.05);else if(k==='click')tone(500,.04,'square',.03);else if(k==='new')tone(520,.09,'sine',.05);else if(k==='rare'){[660,880,1100,1320].forEach((f,i)=>tone(f,.16,'sine',.05,i*.1));}else if(k==='mix')tone(340,.05,'triangle',.04);}

const PREF='jzP03';
function load(){try{const v=localStorage.getItem(PREF);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(PREF,JSON.stringify({v:2,rec:Array.from(discRec)}));}catch(e){}}

/* elementos conhecidos (base sempre + produtos das receitas achadas) */
let seenArr=[];
function refreshSeen(){
  const set={};
  BASE.forEach(e=>set[e.id]=1);
  discRec.forEach(k=>{const r=R[k];if(r)set[r.res]=1;});
  seenArr=[];
  BASE.forEach(e=>seenArr.push(e.id));
  ELEMS.forEach(e=>{if(set[e.id]&&!BASE.some(b=>b.id===e.id))seenArr.push(e.id);});
}
refreshSeen();
function elem(id){return byId[id]||{id:id,n:id,ic:'❔',c:'#888'};}
function recipe(a,b){const k=a+'|'+b;return R[k]?R[k]:(R[b+'|'+a]||null);}
function kOf(a,b){return R[a+'|'+b]?a+'|'+b:b+'|'+a;}

/* estoque dos elementos base */
let stock={};
function stockReset(){BASE.forEach(e=>{if(stock[e.id]===undefined||stock[e.id]<10)stock[e.id]=10;});}
function costOf(a,b){
  const ab=BASE.some(e=>e.id===a),bb=BASE.some(e=>e.id===b);
  if(ab&&bb){return a===b?{a:2,b:0}:{a:1,b:1};}
  if(ab){return {a:1,b:0};}
  if(bb){return {a:0,b:1};}
  return {a:0,b:0};
}
function hasStock(a,b){
  const c=costOf(a,b);
  return stock[a]>=c.a&&stock[b]>=c.b;
}
const COMMON=[
 ['fogo','agua'],['terra','agua'],['fogo','terra'],['ar','fogo'],['terra','ar'],

let pick=[null,null];
const s1El=document.getElementById('s1'),s2El=document.getElementById('s2');
function renderBank(){
  const bank=document.getElementById('bank');bank.innerHTML='';
  seenArr.forEach(id=>{
    const e=elem(id);
    const d=document.createElement('div');
    d.className='el';
    d.style.setProperty('--elc',e.c);
    const base=BASE.some(b=>b.id===id);
    const q=base?(stock[id]||0):null;
    d.innerHTML='<span class="ic">'+e.ic+'</span>'+e.n+(base?'<span class="qty" style="position:static;display:inline-block;margin-left:5px;background:none;color:var(--mut);font-size:10px">×'+q+'</span>':'');
    d.addEventListener('click',()=>select(id));
    if(pick[0]===id||pick[1]===id)d.style.borderColor=e.c;d.style.borderStyle='solid';
    bank.appendChild(d);
  });
}
function select(id){
  if(!hasStock(id,id)&&(pick[0]!==id&&pick[1]!==id)){ /* nothing: products always ok; base handled in doMix */ }
  if(!pick[0])pick[0]=id;else if(!pick[1])pick[1]=id;else pick=[id,null];
  sfx('click');renderSlots();renderBank();
}
function renderSlots(){
  const fill=(el2,id)=>{
    if(!id){el2.className='slot';el2.innerHTML='toque aqui<br>para escolher';return;}
    const e=elem(id);
    el2.className='slot filled';el2.style.setProperty('--elc',e.c);
    el2.innerHTML='<span class="x">×</span><span style="font-size:26px;display:block">'+e.ic+'</span>'+e.n;
  };
  fill(s1El,pick[0]);fill(s2El,pick[1]);
  document.getElementById('mixBtn').disabled=!(pick[0]&&pick[1]);
}
function res(html){document.getElementById('res').innerHTML=html;}
function doMix(){
  if(!pick[0]||!pick[1])return;
  const a=pick[0],b=pick[1];
  const c=costOf(a,b);
  if(stock[a]<c.a||stock[b]<c.b){
    res('<span style="color:var(--bad)">Sem estoque suficiente do elemento base. Misture outras combinações para o próximo lote chegar.</span>');
    sfx('bad');return;
  }
  stock[a]-=c.a;stock[b]-=c.b;
  const rp=recipe(a,b);
  let out;
  if(!rp){
    sfx('bad');
    out='<b>Reação inerte.</b> '+elem(a).n+' e '+elem(b).n+' não reagem — tente outras ordens e combinações, inclusive consigo mesmos.';
    pick=[null,null];renderSlots();renderBank();res(out);return;
  }
  const r=elem(rp.res);
  const key=kOf(a,b);
  const isNewKey=!discRec.has(key);
  const before=elem(rp.res);
  const wasSeen=seenArr.indexOf(rp.res)>=0;
  if(isNewKey){discRec.add(key);refreshSeen();save();}
  const newElem=isNewKey&&!wasSeen;
  sfx(newElem?(rp.t===3?'rare':'new'):'mix');
  const lbl=isNewKey?'NOVA RECEITA':'receita já conhecida';
  out='<b>'+elem(a).ic+' '+elem(a).n+' + '+elem(b).ic+' '+elem(b).n+'</b> → <span style="font-size:24px">'+r.ic+'</span> <b style="color:'+r.c+'">'+r.n+'</b> <span class="'+(rp.t===3?'rare':'new')+'">['+TIER_NAME[rp.t]+']</span> · '+lbl;
  pick=[null,null];renderSlots();renderBank();
  res(out);
  renderHud();
  if(newElem&&rp.t===3)showRare(rp);
}
function showRare(rp){
  const r=elem(rp.res);
  const tips={
    void:'O Vazio consome combinações duplicadas de escuridão…',
    fênix:'Renascimento: só o que queima por completo pode voltar.',
    supernova:'Luz demais colapsa sobre si mesma.',
    buraco_negro:'O que a pressão e a escuridão extremas criam não devolve nada.',
    chama_negra:'Fogo que não ilumina ainda queima.',
    diamante:'Pressão + carbono, em estado puro.',
    robô:'Vida artificial: metal + eletricidade + propósito.',
    arcoiris:'A luz, quando encontra as gotas, se revela.',
    mar:'O encontro de dois mundos líquidos forma o maior deles.'
  };
  const mx=document.getElementById('resBox');
  mx.innerHTML='<div class="big">✨</div><h2 style="color:var(--rare2)">Descoberta rara!</h2>'+
   '<p style="font-size:44px">'+r.ic+'</p><p style="font-size:22px;color:#fff"><b>'+r.n+'</b></p>'+
   '<p>Raridade: <b style="color:var(--rare2)">'+TIER_NAME[rp.t]+'</b> · Caderno: <b>'+discRec.size+' / '+TOTAL+' receitas</b></p>'+
   (tips[rp.res]?'<p style="color:var(--mut);font-style:italic">“'+tips[rp.res]+'”</p>':'')+
   '<div class="rowB"><button class="btn sol" style="background:var(--rare2);border:0;color:#1a0b22;font-weight:800" onclick="closeBig()">Continuar experimentando</button></div>';

function renderHud(){
  document.getElementById('cnt').textContent=discRec.size;
  document.getElementById('pct').textContent=Math.round(discRec.size/TOTAL*100)+'%';
  document.getElementById('pctBar').style.width=(discRec.size/TOTAL*100)+'%';
  const book=document.getElementById('book');book.innerHTML='';
  const frag=document.createDocumentFragment();
  function row(e,tag){
    const d=document.createElement('div');d.className='ent';
    d.innerHTML='<span class="nm"><span class="elem-badge" style="--elc:'+e.c+'">'+e.ic+'</span>'+e.n+'</span><span class="rs">'+tag+'</span>';
    d.addEventListener('click',()=>{if(hasStock(e.id,e.id)||true){pick=[e.id,null];renderSlots();renderBank();sfx('click');}});
    frag.appendChild(d);
  }
  BASE.forEach(e=>row(e,'inicial'));
  const extra=[];
  discRec.forEach(k=>{const r=R[k];if(r&&!BASE.some(b=>b.id===r.res)&&extra.indexOf(r.res)<0)extra.push(r.res);});
  extra.forEach(id=>row(elem(id),'descoberto'));
  if(!extra.length){
    book.innerHTML='<div style="color:var(--mut);font-size:13px;padding:10px 0">Caderno vazio de elementos sintetizados. Misture os elementos iniciais para produzir o primeiro.</div>';
  }else book.appendChild(frag);
}
function resetAll(){
  if(!confirm('Apagar todas as receitas e recomeçar do zero?'))return;
  discRec.clear();refreshSeen();save();pick=[null,null];stockReset();
  renderSlots();renderBank();renderHud();
  res('Caderno apagado. Laboratório reiniciado com os 8 elementos iniciais.');
  sfx('click');
}
const helpHtml='<h2 style="color:var(--acc)">Como jogar</h2>'+
 '<p>Combine <b>dois elementos</b> para sintetizar algo novo. Tudo o que você descobre entra no <b>caderno</b> e pode ser reutilizado como ingrediente — o laboratório é uma enciclopédia viva de reações.</p>'+
 '<p>Há <b>'+TOTAL+' receitas</b> (comuns, incomuns e raras — estas brilham em rosa) e <b>'+ELEMS.length+' elementos sintetizáveis</b>. O contador do caderno marca <b>receitas descobertas</b>, não elementos: uma mesma substância pode nascer de combinações diferentes.</p>'+
 '<p>Elementos iniciais têm estoque limitado (chega lote novo a cada misturas). Ordem não importa; misturar um elemento consigo mesmo pode reagir. Descobrir um produto novo desbloqueia ramos inteiros do grafo de reações.</p>'+
 '<div class="rowB"><button class="btn sol" style="background:var(--acc);border:0;color:#04120c;font-weight:800" onclick="closeBig()">Mãos à obra</button></div>';
(function(){
  stockReset();renderBank();renderSlots();renderHud();
  const cm=document.getElementById('common');
  COMMON.forEach(([a,b])=>{
    if(!recipe(a,b))return;
    const btn=document.createElement('button');
    btn.className='mix';btn.style.padding='8px 12px';btn.style.fontSize='12px';btn.style.background='#15202b';btn.style.color='#cfe3d6';
    btn.innerHTML=elem(a).ic+' + '+elem(b).ic;
    btn.addEventListener('click',()=>{pick=[a,b];renderSlots();renderBank();doMix();});
    cm.appendChild(btn);
  });
  document.getElementById('mixBtn').addEventListener('click',doMix);
  document.getElementById('helpBtn').addEventListener('click',()=>{sfx('click');const m=document.getElementById('big');document.getElementById('resBox').innerHTML=helpHtml;m.classList.add('open');});
  document.getElementById('rstBtn').addEventListener('click',resetAll);
  s1El.addEventListener('click',()=>{if(pick[0]){pick=[null,null];renderSlots();renderBank();}});
  s2El.addEventListener('click',()=>{if(pick[1]){pick=[null,null];renderSlots();renderBank();}});
  document.getElementById('hint').innerHTML='💡 Dica: use o <b>caderno</b> para carregar um elemento já conhecido no misturador. E o que a Água faz com quase tudo muda quando ela vira Vapor…';
})();
</script>
