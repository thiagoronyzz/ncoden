<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jogo 11 · Robô Programável — JogoZ</title>
<style>
  :root{--bg:#0b0f1c;--panel:#131a30;--line:#263259;--txt:#e8edff;--mut:#8b97c4;--ac:#4dd2ff;--ok:#63e6b0;--bad:#ff8fa3;--gold:#ffd166}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;background:radial-gradient(900px 420px at 85% -10%,rgba(77,210,255,.11),transparent 55%),linear-gradient(180deg,var(--bg),#05070f);color:var(--txt);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(11,15,28,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .top a{color:var(--ac);text-decoration:none;font-weight:700;font-size:14px;padding:6px 10px;border-radius:8px;display:flex;gap:5px}
  .top a:hover{background:rgba(77,210,255,.1)}
  .ttl{font-weight:800}
  .sp{flex:1}
  .btn{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13px;font-weight:600;min-height:38px}
  .btn:hover{border-color:var(--ac)}
  .btn.go{background:linear-gradient(135deg,#4dd2ff,#2a7bd4);color:#03121d;border:0;font-weight:800}
  .btn.stop{background:rgba(255,143,163,.12);border-color:#7a3a47;color:#ffc4cf}
  .wrap{max-width:1150px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1fr 350px;gap:14px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin-bottom:10px;line-height:1.4}
  .grid{display:inline-grid;gap:3px;background:#0a0e1c;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
  .cell{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;background:#111a30;font-size:19px;position:relative}
  .cell.wall{background:#2b3a5e}
  .cell.goal{background:#0f4a3a;box-shadow:inset 0 0 0 2px var(--ok)}
  .cell.robotCell{outline:2px solid var(--ac)}
  .robot{position:absolute;inset:3px;background:linear-gradient(135deg,#ffd166,#e08a3c);border-radius:9px;display:grid;place-items:center}
  .cmds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .cbtn{padding:9px 11px;border-radius:9px;background:#1d2948;color:#dce6ff;border:1px solid #2e3f72;font-size:12.5px;font-weight:600;min-height:38px}
  .cbtn:hover{border-color:var(--ac)}
  .prog{background:#0b1120;border:1px solid var(--line);border-radius:12px;padding:6px;min-height:96px;max-height:280px;overflow:auto}
  .cmd{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;font-size:13px;border:1px solid transparent}
  .cmd .rm{color:var(--bad);cursor:pointer;font-weight:800;margin-left:auto;padding:0 4px}
  .runline{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .stat{font-size:12.5px;color:var(--mut)}
  .stat b{color:#fff}
  .log{max-height:170px;overflow:auto;font-size:12px;line-height:1.5;margin-top:8px}
  .log div{padding:3px 0;color:#aeb9dd;border-bottom:1px dashed rgba(38,50,89,.5)}
  .log .ok{color:var(--ok)}.log .bad{color:var(--bad)}.log .i{color:var(--ac)}
  .msgline{min-height:18px;font-size:13px;margin-top:6px}
  .msgline.good{color:var(--ok)}.msgline.bad{color:var(--bad)}
  .stages{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
  .st{border:0;width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--mut);font-weight:800}
  .st.on{background:linear-gradient(135deg,#4dd2ff,#2a7bd4);color:#03121d}
  .st.won{border-color:var(--gold);color:var(--gold)}
  .st.lock{opacity:.35}
  .bigmsg{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.88);z-index:80;padding:16px}
  .bigmsg.open{display:grid}
  .res{background:linear-gradient(160deg,#182242,#0c1226);border:1px solid var(--ok);border-radius:18px;max-width:540px;width:100%;padding:24px;text-align:center;max-height:88vh;overflow:auto}
  .res h2{font-size:22px;margin-bottom:6px}
  .res p{line-height:1.65;font-size:13.5px;color:#d7dff5;margin:7px 0;text-align:left}
  .rowB{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .meta{font-size:12.5px;color:var(--mut);margin-bottom:8px}
  .meta b{color:var(--gold)}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html">← JogoZ</a><span class="ttl">11 · Robô Programável</span><span class="sp"></span>
  <span style="font-size:13px;color:var(--mut)">Fase <b id="phaseN" style="color:#fff">1</b>/6</span>
  <button class="btn" id="helpBtn" aria-label="Ajuda">?</button>
</header>
<div class="wrap">
  <main>
    <div class="panel">
      <h3>Fase <span id="fttl"></span></h3>
      <div class="meta" id="metaLine"></div>
      <div class="stages" id="stages"></div>
      <div id="gridBox"></div>
      <div class="msgline" id="msg"></div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h3>Console</h3>
      <div class="log" id="log"></div>
    </div>
  </main>
  <aside>
    <div class="panel">
      <h3>Comandos</h3>
      <div class="cmds" id="cmds"></div>
      <h3>Programa <button class="btn" id="clrBtn" style="float:right;padding:2px 8px;min-height:24px">limpar</button></h3>
      <div class="prog" id="prog"></div>
      <div class="runline">
        <button class="btn go" id="runBtn">▶ Executar</button>
        <button class="btn" id="stepBtn">⏭ Passo</button>
        <button class="btn stop" id="stopBtn">⏹</button>
        <span class="stat">Blocos: <b id="cnt">0</b></span>
        <span class="stat">Passos: <b id="stp">0</b></span>
      </div>
    </div>
  </aside>
</div>
<div class="bigmsg" id="big"><div class="res" id="resBox"></div></div>
<script>
"use strict";
/* ---------------- áudio (Web Audio, sem arquivos) ---------------- */
let AC=null;
function tone(f,d,type,g,when){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(when||0),o=AC.createOscillator(),v=AC.createGain();o.type=type||'square';o.frequency.value=f;v.gain.value=g||.04;o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d);o.onended=function(){o.disconnect();v.disconnect();};}catch(e){}}
function sfx(k){if(k==='ok'){tone(680,.08,'square',.05);tone(1000,.12,'square',.05,.07);}else if(k==='bad')tone(180,.2,'sawtooth',.05);else if(k==='click')tone(520,.04,'square',.03);else if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.15,'square',.05,i*.11));}}
document.addEventListener('pointerdown',function(){if(AC&&AC.state==='suspended')AC.resume();},{once:true});

/* ---------------- progresso ---------------- */
const PREF='jzP11';
function load(){try{const v=localStorage.getItem(PREF);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(PREF,JSON.stringify({unlock:unlock,best:best}));}catch(e){}}
let unlock=1,best={};
(function(){const s=load();if(s){unlock=Math.min(6,Math.max(1,(s.unlock||1)|0));best=s.best||{};}})();

/* ---------------- fases (validadas por busca automática) ----------------
   gold = menor programa (contando cada bloco) que resolve a fase
   lim  = limite confortável para vencer */
const LEVELS=[
 {name:'Primeira marcha',goal:0,gold:4,lim:7,rows:["wwwwwww","wS   xw","wwwwwww"]},
 {name:'Coleta dupla',goal:2,gold:6,lim:9,rows:["wwwwwwwww","wS  oo xw","wwwwwwwww"]},
 {name:'Curva segura',goal:2,gold:9,lim:14,rows:["wwwwwww","wS o  w","wx  o w","wwwwwww"]},
 {name:'Caminho em C',goal:4,gold:16,lim:24,rows:["wwwwwwwww","wS o o  w","wwwwwww w","wx o o  w","wwwwwwwww"]},
 {name:'O anel',goal:4,gold:22,lim:32,rows:["wwwwwwwwwww","wS        w","w   www   w","w   www   w","w   www   w","wx o o o ow","wwwwwwwwwww"]},
 {name:'Linha de montagem',goal:5,gold:20,lim:29,rows:["wwwwwwwwwww","wS o o o  w","wwwwwwwww w","wx o o    w","wwwwwwwwwww"]}];

const DIRS=[[-1,0],[0,1],[1,0],[0,-1]];
let lvl=0,L=null,R=null,program=[],running=false,cursor=0,execs=0,itemsGot=0,timerId=0,ctxs=[],pauseAfter=false;

function parseLevel(idx){
  const rows=LEVELS[idx].rows.map(r=>r.split(''));
  const start={r:0,c:0,dir:1}; /* robô sempre começa virado para a direita */
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[0].length;c++){
    if(rows[r][c]==='S'){start.r=r;start.c=c;rows[r][c]=' ';}
  }
  return {rows,start};
}
function inL(r,c){return r>=0&&c>=0&&r<L.rows.length&&c<L.rows[0].length;}
function blockCount(list){
  let n=0;
  for(const e of list){n++;if(e.op&&e.op.t==='r')n+=blockCount(e.op.body);}
  return n;
}
function reset(){
  stop();
  L=parseLevel(lvl);program=[];itemsGot=0;execs=0;
  R={r:L.start.r,c:L.start.c,dir:1};
  log('Programa limpo. Robô na posição inicial.','i');
  renderAll();
}
function stop(){running=false;pauseAfter=false;cursor=0;ctxs=[];clearTimeout(timerId);}
function addCmd(op){
  if(blockCount(program)>=30){setMsg('Programa cheio (30 blocos).','bad');return;}
  program.push({op});sfx('click');renderProg();
}
function addRepeat(){
  const n=parseInt(prompt('Quantas repetições? (1–12)','3'),10);
  if(!(n>=1&&n<=12))return;
  const sel=prompt('Comandos internos — f=andar e=esquerda d=direita w=esperar (ex.: "f f")','f f');
  if(sel===null)return;
  const body=[];
  sel.toLowerCase().split(/[\s,]+/).forEach(k=>{
    const op=k==='e'?'e':k==='d'?'d':k==='w'?'esperar':'f';
    body.push({op});
  });
  if(!body.length)return;
  if(blockCount(program)+1+body.length>30){setMsg('Programa cheio (30 blocos).','bad');return;}
  program.push({op:{t:'r',n,body}});
  sfx('click');renderProg();
}
function delCmd(i){program.splice(i,1);sfx('click');renderProg();}
function run(){
  if(running)return;
  if(!program.length){setMsg('Monte um programa antes de executar.','bad');sfx('bad');return;}
  const bc=blockCount(program);
  if(bc>LEVELS[lvl].lim){log('Atenção: programa com '+bc+' blocos (limite da fase: '+LEVELS[lvl].lim+'). Máx. ★1 se vencer.','bad');}
  startSim();
  log('▶ Executando programa…','ok');
  stepOnce();
}
function stepBtn(){
  if(running){stop();}
  if(!ctxs.length){startSim();log('▶ Passo a passo iniciado.','i');}
  else{running=true;}
  pauseAfter=true;
  stepOnce();
}
function startSim(){
  L=parseLevel(lvl);itemsGot=0;execs=0;running=true;pauseAfter=false;
  R={r:L.start.r,c:L.start.c,dir:1};
  ctxs=[{kind:'root',list:program,i:0}];
  renderAll();
}
function stepOnce(){
  if(!running)return;
  const top=ctxs[ctxs.length-1];
  if(!top){finishCheck();return;}
  if(top.i>=top.list.length){
    if(top.kind==='rep'){
      top.remain--;
      if(top.remain>0){top.i=0;schedule();return;}
    }
    ctxs.pop();
    if(!ctxs.length){finishCheck();return;}
    schedule();
    return;
  }
  const node=top.list[top.i];
  top.i++;
  if(node.op&&node.op.t==='r'){
    ctxs.push({kind:'rep',list:node.op.body,i:0,remain:node.op.n});
    schedule(340);
    return;
  }
  const ok=doOp(node.op);
  execs++;
  if(ok==='err'){renderAll();return;}
  renderAll();
  schedule(node.op==='esperar'?640:250);
}
function schedule(ms){
  if(!running)return;
  if(pauseAfter){pauseAfter=false;running=false;renderAll();return;}
  clearTimeout(timerId);
  timerId=setTimeout(function(){stepOnce();},ms||250);
}
function doOp(op){
  if(op==='f'){
    const nr=R.r+DIRS[R.dir][0],nc=R.c+DIRS[R.dir][1];
    if(!inL(nr,nc)||L.rows[nr][nc]==='w'){
      setMsg('🤖 Bateu na parede!','bad');sfx('bad');
      log('ERRO: bateu na parede.','bad');
      running=false;return 'err';
    }
    R.r=nr;R.c=nc;pickUp();
    return;
  }
  if(op==='e'){R.dir=(R.dir+3)%4;log('↰ virou à esquerda.');return;}
  if(op==='d'){R.dir=(R.dir+1)%4;log('↱ virou à direita.');return;}
  if(op==='esperar'){log('⏳ esperando…');return;}
  log('comando desconhecido: '+op);
}
function pickUp(){
  if(L.rows[R.r][R.c]==='o'){
    L.rows[R.r][R.c]=' ';itemsGot++;sfx('ok');
    log('📦 coletou item ('+itemsGot+'/'+LEVELS[lvl].goal+').','ok');
  }
}
function finishCheck(){
  running=false;
  const onGoal=inL(R.r,R.c)&&L.rows[R.r][R.c]==='x';
  const need=LEVELS[lvl].goal;
  if(itemsGot>=need&&onGoal){win();}
  else{
    sfx('bad');
    setMsg(need>0
      ?'Programa terminou sem cumprir o objetivo ('+itemsGot+'/'+need+' itens).'
      :'Programa terminou, mas o robô não parou na 🏁.','bad');
    log('Fim do programa: objetivo não concluído.','bad');
  }
}
function win(){
  const cmds=blockCount(program),g=LEVELS[lvl].gold,mx=LEVELS[lvl].lim;
  let stars,msgStars;
  if(cmds<=g){stars=3;msgStars='Excelente! Programa de ouro.';}
  else if(cmds<=mx){stars=2;msgStars='Bom! Programa dentro do limite.';}
  else{stars=1;msgStars='Venceu, mas o programa estourou o limite ('+mx+' blocos).';}
  const k='l'+(lvl+1);
  if(lvl+1<LEVELS.length&&lvl+1>=unlock){unlock=lvl+2;}
  if(!best[k]||stars>best[k]){best[k]=stars;}
  save();sfx('win');
  renderStages();
  document.getElementById('resBox').innerHTML='<h2 style="color:var(--ok)">🤖 Fase concluída!</h2>'+
    '<p>Blocos usados: <b>'+cmds+'</b> · meta ouro ≤ '+g+' · limite '+mx+' · passos: '+execs+'.</p>'+
    '<p>'+msgStars+'</p>'+
    '<p style="text-align:center;font-size:22px"><b style="color:var(--gold)">'+'★'.repeat(stars)+'</b><span style="opacity:.25">'+'★'.repeat(3-stars)+'</span></p>'+
    '<div class="rowB">'+(lvl+1<LEVELS.length?'<button class="btn go" onclick="go('+(lvl+1)+')">Próxima fase →</button>':'<button class="btn go" onclick="go(0)">Recomeçar fases</button>')+
    '<button class="btn" onclick="go('+lvl+')">Repetir fase</button></div>';
  document.getElementById('big').classList.add('open');
}
function go(i){
  document.getElementById('big').classList.remove('open');
  lvl=i;reset();
}
function setMsg(m,c){const e=document.getElementById('msg');e.textContent=m;e.className='msgline'+(c?' '+c:'');}
function log(m,c){
  const e=document.getElementById('log');const d=document.createElement('div');
  d.className=c||'';d.textContent=m;e.appendChild(d);
  while(e.children.length>50)e.removeChild(e.firstChild);
  e.scrollTop=e.scrollHeight;
}
function renderGrid(){
  const box=document.getElementById('gridBox');box.innerHTML='';
  const g=document.createElement('div');g.className='grid';
  g.style.gridTemplateColumns='repeat('+L.rows[0].length+',40px)';
  L.rows.forEach(row=>row.forEach(ch=>{
    const cell=document.createElement('div');
    cell.className='cell';
    if(ch==='w')cell.classList.add('wall');
    if(ch==='x')cell.classList.add('goal');
    if(ch==='o')cell.textContent='📦';
    if(ch==='x')cell.textContent='🏁';
    g.appendChild(cell);
  }));
  const idx=R.r*L.rows[0].length+R.c;
  const cells=g.children;
  if(cells[idx]){
    cells[idx].classList.add('robotCell');
    const rob=document.createElement('div');
    rob.className='robot';rob.style.width='30px';rob.style.height='30px';
    rob.textContent=['▲','▶','▼','◀'][R.dir];
    cells[idx].appendChild(rob);
  }
  box.appendChild(g);
}
function cmdName(n){
  const map={f:'🤖 andar',e:'↰ esquerda',d:'↱ direita',esperar:'⏳ esperar'};
  if(n.op&&n.op.t==='r'){
    return '🔁 '+n.op.n+'× ['+n.op.body.map(x=>cmdName(x)).join(' · ')+']';
  }
  return map[n.op]||n.op;
}
function renderProg(){
  const p=document.getElementById('prog');p.innerHTML='';
  if(!program.length){p.innerHTML='<div style="color:var(--mut);font-size:13px">Toque nos comandos para montar o programa.</div>';}
  program.forEach((n,i)=>{
    const d=document.createElement('div');
    d.className='cmd';
    d.innerHTML='<span>'+cmdName(n)+'</span><span class="rm" title="remover">✕</span>';
    d.querySelector('.rm').addEventListener('click',function(){delCmd(i);});
    p.appendChild(d);
  });
  document.getElementById('cnt').textContent=blockCount(program);
  document.getElementById('stp').textContent=execs;
}
function renderStages(){
  const st=document.getElementById('stages');st.innerHTML='';
  LEVELS.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='st';
    if(i+1>unlock){b.classList.add('lock');b.disabled=true;}
    if(i===lvl)b.classList.add('on');
    const bs=best['l'+(i+1)];
    if(bs){b.classList.add('won');b.title='Melhor: '+'★'.repeat(bs);}
    b.textContent=i+1;
    b.addEventListener('click',function(){go(i);});
    st.appendChild(b);
  });
}
function renderAll(){
  const lv=LEVELS[lvl];
  document.getElementById('phaseN').textContent=lvl+1;
  document.getElementById('fttl').textContent=(lvl+1)+' — '+lv.name;
  const g=lv.goal;
  document.getElementById('metaLine').innerHTML=
    (g>0?'Colete <b>'+g+' 📦</b> e pare na 🏁':'Chegue até a 🏁')+
    ' · <b style="color:var(--gold)">meta ★★★: ≤ '+lv.gold+' blocos</b> · limite: '+lv.lim;
  renderStages();
  renderGrid();
  renderProg();
}
(function ui(){
  renderStages();
  const list=[['f','🤖 andar'],['e','↰ esquerda'],['d','↱ direita'],['esperar','⏳ esperar'],['rep','🔁 repetir…']];
  const cb=document.getElementById('cmds');
  list.forEach(function(entry){
    const b=document.createElement('button');
    b.className='cbtn';b.textContent=entry[1];
    b.addEventListener('click',function(){entry[0]==='rep'?addRepeat():addCmd(entry[0]);});
    cb.appendChild(b);
  });
})();
document.getElementById('runBtn').addEventListener('click',run);
document.getElementById('stepBtn').addEventListener('click',stepBtn);
document.getElementById('stopBtn').addEventListener('click',function(){if(running){stop();log('⏹ Execução interrompida.','bad');renderAll();}});
document.getElementById('clrBtn').addEventListener('click',reset);
document.getElementById('helpBtn').addEventListener('click',function(){
  sfx('click');
  document.getElementById('resBox').innerHTML='<h2 style="color:var(--ac)">Como programar</h2>'+
  '<p>Monte o programa com os blocos <b>andar, virar, esperar e repetir</b> e clique em <b>Executar</b>, ou use <b>Passo</b> para executar um comando por vez (e <b>⏹</b> para parar).</p>'+
  '<p>📦 são coletados automaticamente ao andar por cima. Para vencer é preciso coletar todos os itens <b>e</b> terminar o programa parado sobre a 🏁.</p>'+
  '<p>Virar é em relação à direção atual do robô (▲▶▼◀). Bater na parede interrompe o programa com erro.</p>'+
  '<p><b style="color:var(--gold)">Estrelas:</b> cada bloco do programa conta (um 🔁 conta 1 + seus blocos internos). Programas ≤ meta ★★★ recebem 3 estrelas; dentro do limite, 2; acima do limite, 1.</p>'+
  '<p>Fases novas são liberadas ao vencer. Tudo fica salvo neste navegador.</p>'+
  '<div class="rowB"><button class="btn go" onclick="document.getElementById(\'big\').classList.remove(\'open\')">Entendi</button></div>';
  document.getElementById('big').classList.add('open');
});
reset();
</script>
</body>
</html>
