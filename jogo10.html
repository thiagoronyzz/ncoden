<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jogo 10 · Puzzle Temporal — JogoZ</title>
<style>
  :root{--bg:#0a0e18;--panel:#121a2c;--line:#233256;--txt:#e4ecff;--mut:#8a97c0;--ac:#ffd166;--ok:#6ee7b7;--bad:#ff9b93;--me:#7aa5ff;--ec:#ff8fd8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;background:radial-gradient(900px 420px at 85% -10%,rgba(122,165,255,.13),transparent 55%),linear-gradient(180deg,var(--bg),#05070e);color:var(--txt);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(10,14,24,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .top a{color:var(--me);text-decoration:none;font-weight:700;font-size:14px;padding:6px 10px;border-radius:8px;display:flex;gap:5px}
  .top a:hover{background:rgba(122,165,255,.1)}
  .ttl{font-weight:800}
  .sp{flex:1}
  .btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--ac)}
  .btn.warn{background:linear-gradient(135deg,#ff9b93,#a0443c);color:#fff;border:0}
  .btn.pri{background:linear-gradient(135deg,#ffd166,#b8862f);color:#1a1302;border:0;font-weight:800}
  .wrap{max-width:1000px;margin:0 auto;padding:12px}
  .stageWrap{position:relative;max-width:100%;overflow:auto}
  canvas{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:14px;background:#0d1424}
  .status{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0;font-size:13.5px;color:var(--mut)}
  .status b{color:#fff}
  .stages{display:flex;gap:6px;margin:0 6px}
  .st{border:0;width:34px;height:34px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--mut);font-weight:800;font-size:13px;cursor:pointer}
  .st.on{background:linear-gradient(135deg,#ffd166,#b8862f);color:#1a1302}
  .st.lock{opacity:.4}
  .hint{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.55}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px;align-items:center}
  .lg{display:flex;align-items:center;gap:6px}
  .sq{width:14px;height:14px;border-radius:4px;display:inline-block}
  .msgline{min-height:18px;font-size:13px;margin-top:6px;color:var(--mut)}
  .msgline.good{color:var(--ok)}.msgline.bad{color:var(--bad)}
  .bigmsg{position:fixed;inset:0;display:none;place-items:center;background:rgba(2,5,12,.9);z-index:80;padding:16px}
  .bigmsg.open{display:grid}
  .res{background:linear-gradient(160deg,#16203a,#0d1424);border:1px solid var(--ac);border-radius:18px;max-width:540px;width:100%;padding:24px;max-height:88vh;overflow:auto}
  .res h2{margin-bottom:8px;font-size:21px}
  .res p{line-height:1.65;font-size:13.5px;color:#d7e1f8;margin:7px 0}
  .rowB{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .keys{display:inline-flex;gap:4px;flex-wrap:wrap}
  .dp{display:none;grid-template-columns:56px 56px 56px;gap:6px;margin:10px auto;width:fit-content}
  .dbtn{width:56px;height:50px;border-radius:12px;border:1px solid var(--line);background:#1a2440;color:#fff;font-size:19px}
  .dbtn:nth-child(1){grid-column:2;grid-row:1}
  .dbtn:nth-child(2){grid-column:1;grid-row:2}
  .dbtn:nth-child(3){grid-column:2;grid-row:2}
  .dbtn:nth-child(4){grid-column:3;grid-row:2}
  @media(pointer:coarse){.dp{display:grid}}
  .k{border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#1a2440;font-size:12px}
  @media(max-width:760px){.ttl{display:none}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html">← JogoZ</a><span class="ttl">10 · Puzzle Temporal</span><span class="sp"></span>
  <span style="font-size:13px;color:var(--mut)">Nível <b id="lv" style="color:#fff">1</b>/6</span>
  <div class="stages" id="stages"></div>
  <button class="btn" id="helpBtn">?</button>
  <button class="btn warn" id="undoBtn">↩ Desfazer último eco</button>
  <button class="btn warn" id="rstBtn">Reiniciar nível</button>
</header>
<div class="wrap">
  <div class="status">
    <span>Tique: <b id="tick">0</b>/<span id="tickMax">0</span></span>
    <span>Ecos ativos: <b id="ecoN">0</b></span>
    <span>Tentativa atual: <b id="att">1</b></span>
    <span id="stateTxt" style="color:var(--ok)">girando…</span>
  </div>
  <div class="stageWrap"><canvas id="cv"></canvas></div>
  <div class="msgline" id="msg">Use as setas ou WASD para se mover. No fim da tentativa, seu caminho vira um <b>eco</b> que se repete — coopere com ele.</div>
  <div class="dp" id="dp">
    <button class="dbtn" data-k="ArrowUp">▲</button>
    <button class="dbtn" data-k="ArrowLeft">◀</button>
    <button class="dbtn" data-k="ArrowDown">▼</button>
    <button class="dbtn" data-k="ArrowRight">▶</button>
  </div>
  <div class="legend">
    <span class="lg"><span class="sq" style="background:#0d1424;border:1px solid #2a3a68"></span> piso</span>
    <span class="lg"><span class="sq" style="background:#7aa5ff;border-radius:50%"></span> você</span>
    <span class="lg"><span class="sq" style="background:#ff8fd8;border-radius:50%"></span> eco seu</span>
    <span class="lg"><span class="sq" style="background:#39496e"></span> parede</span>
    <span class="lg"><span class="sq" style="background:#294022"></span> placa de pressão</span>
    <span class="lg"><span class="sq" style="background:#3a1a22"></span> porta (fecha sem pressão)</span>
    <span class="lg"><span class="sq" style="background:#0f6b4a"></span> saída</span>
  </div>
</div>
<div class="bigmsg" id="big"><div class="res" id="resBox"></div></div>
<script>
"use strict";
let AC=null;
function tone(f,d,type,g,when){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(when||0),o=AC.createOscillator(),v=AC.createGain();o.type=type||'square';o.frequency.value=f;v.gain.value=g||.04;o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d);o.onended=function(){o.disconnect();v.disconnect();};}catch(e){}}
function sfx(k){if(k==='ok'){tone(660,.08,'square',.05);tone(990,.13,'square',.05,.08);}else if(k==='bad')tone(190,.2,'sawtooth',.05);else if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.15,'square',.05,i*.12));}else if(k==='tick')tone(700,.03,'square',.02);else if(k==='rec')tone(420,.07,'square',.04);}
document.addEventListener('pointerdown',function(){if(AC&&AC.state==='suspended')AC.resume();},{once:true});
const PREF='jzP10';
function load(){try{const v=localStorage.getItem(PREF);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(PREF,JSON.stringify({played:true,unlock:unlock,best:best}));}catch(e){}}
let unlock=1,best={};
(function(){const s=load();if(s){unlock=Math.max(1,s.unlock||1);best=s.best||{};}})();

/* ===== fases =====
 Legenda: # parede · S início · G saída · P placa de pressão · D porta
 doors: lista {p:[r,c], d:[r,c]} liga placa à porta
*/
const LEVELS=[ {name:"Primeiros passos",ticks:30,rows:["#######","#S   G#","#######"],doors:[]}, {name:"Porta de press\u00e3o",ticks:50,rows:["#########","#S   P  #","#####D###","#   G   #","#########"],doors:[{p:[1,5],d:[2,5]}]}, {name:"Dois port\u00f5es",ticks:80,rows:["#############","#S         P#","######D######","#           #","##########D##","# G         #","#############"],doors:[{p:[1,11],d:[2,6]},{p:[1,11],d:[4,10]}]}, {name:"Passagem longa",ticks:70,rows:["###############","#S           P#","#############D#","#  P          #","###D###########","#            G#","###############"],doors:[{p:[1,13],d:[2,13]},{p:[3,3],d:[4,3]}]}, {name:"Tr\u00eas m\u00e3os fazem",ticks:130,rows:["###################","#S         P    P #","######D############","#                 #","##########D########","#                 #","##############D####","#  G              #","###################"],doors:[{p:[1,11],d:[2,6]},{p:[1,11],d:[4,10]},{p:[1,16],d:[6,14]}]}, {name:"Rel\u00f3gio do fim",ticks:160,rows:["###################","#S    P           #","######D############","#               P #","##########D########","#               P #","##########D########","# G               #","###################"],doors:[{p:[1,6],d:[2,6]},{p:[3,16],d:[4,10]},{p:[5,16],d:[6,10]}]}
];
function buildL(lv){
  const rows=lv.rows.map(r=>r.split(''));
  const H=rows.length,W=rows[0].length;
  const start=[],goal=[];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    if(rows[r][c]==='S')start=[r,c];
    if(rows[r][c]==='G')goal=[r,c];
  }
  return {rows,H,W,start,goal,doors:lv.doors.map(d=>({p:d.p,d:d.d,open:false}))};
}
function passable(L,r,c,doors){
  if(r<0||c<0||r>=L.H||c>=L.W)return false;
  const ch=L.rows[r][c];
  if(ch==='#')return false;
  if(ch==='D'){
    const dr=doors.find(d=>d.d[0]===r&&d.d[1]===c);
    return dr?dr.open:false;
  }
  return true;
}
/* atores: {kind:'you'|'echo', color, r,c, dirs:[], idx} */
const TILE=40;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let lvl=0,L=null,records=[],you=null,ticks=0,raf=0,lastTs=0,acc=0,over=false;
const TICKMS=150;
const keys={};
let stateTxt='';
function resetLevel(){
  L=buildL(LEVELS[lvl]);records=[];ticks=0;over=false;you=null;acc=0;
  setMsg('');
  newAttempt();
  ensureLoop();
}
function newAttempt(){
  // atores: ecos das tentativas anteriores + você
  you={kind:'you',color:'#7aa5ff',r:L.start[0],c:L.start[1],dirs:[],idx:-1};
  actors=[you].concat(records.map((rec,i)=>({kind:'echo',color:i===0?'#ff8fd8':'#ffb4e6',r:L.start[0],c:L.start[1],dirs:rec,idx:0})));
  ticks=0;stateTxt='';
  renderHud();
}
let actors=[];
function recordLen(){return you?you.dirs.length:0;}

function tick(){
  if(over||!you)return;
  ticks++;
  // determina direção do jogador neste tique
  let dr=0,dc=0;
  if(keys['ArrowUp']||keys['w']||keys['W'])dr=-1;
  else if(keys['ArrowDown']||keys['s']||keys['S'])dr=1;
  else if(keys['ArrowLeft']||keys['a']||keys['A'])dc=-1;
  else if(keys['ArrowRight']||keys['d']||keys['D'])dc=1;
  // aplica portas
  L.doors.forEach(d=>{d.open=false;});
  const occupy=(r,c)=>{L.doors.forEach(d=>{if(d.p[0]===r&&d.p[1]===c)d.open=true;});};
  actors.forEach(a=>occupy(a.r,a.c));
  // move ecos
  actors.forEach(a=>{
    if(a.kind==='echo'){
      const d=a.dirs[a.idx];a.idx++;
      if(d){const nr=a.r+d[0],nc=a.c+d[1];
        if(passable(L,nr,nc,L.doors)){a.r=nr;a.c=nc;}
      }
    }
  });
  // move jogador
  if(dr||dc){
    const nr=you.r+dr,nc=you.c+dc;
    you.dirs.push([dr,dc]);
    if(passable(L,nr,nc,L.doors)){you.r=nr;you.c=nc;}
  }else{
    you.dirs.push([0,0]);
  }
  // reaplica portas com posições novas
  L.doors.forEach(d=>{d.open=false;});
  actors.forEach(a=>occupy(a.r,a.c));
  // venceu?
  if(you.r===L.goal[0]&&you.c===L.goal[1]){
    records.push(you.dirs.slice());
    sfx('win');afterWin();return;
  }
  // tempo esgotado: guarda o eco e inicia nova tentativa
  if(ticks>=LEVELS[lvl].ticks){
    records.push(you.dirs.slice());
    sfx('bad');
    setMsg('Tempo da tentativa esgotado. Seu caminho virou um eco; prepare a próxima tentativa.','bad');
    newAttempt();
  }
  renderHud();
}
function afterWin(){
  over=true;
  const attempts=records.length;
  let stars=1;
  if(attempts===1)stars=3;else if(attempts<=3)stars=2;
  if(lvl+1>=unlock&&lvl+1<LEVELS.length)unlock=lvl+2;
  const k='l'+(lvl+1);
  if(!best[k]||stars>best[k]){best[k]=stars;save();}
  renderHud();
  document.getElementById('resBox').innerHTML=
    '<h2 style="color:var(--ok)">⏳ Linha temporal concluída!</h2>'+
    '<p>Você usou <b>'+attempts+'</b> tentativa'+(attempts>1?'s':'')+' (cada tentativa antiga virou um eco cooperando).</p>'+
    '<p>Estrelas: <b style="color:var(--ac)">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</b></p>'+
    '<div class="rowB">'+(lvl+1<LEVELS.length?'<button class="btn pri" onclick="goLevel('+(lvl+1)+')">Próximo nível →</button>':'<button class="btn pri" onclick="goLevel(0)">Jogar tudo de novo</button>')+
    '<button class="btn" onclick="goLevel('+lvl+')">Repetir nível</button></div>';
  document.getElementById('big').classList.add('open');
}
function goLevel(i){sfx('click');document.getElementById('big').classList.remove('open');lvl=i;resetLevel();}
function undoLast(){sfx('click');records.pop();setMsg('Último eco removido.');newAttempt();}
function setMsg(t,c){const el=document.getElementById('msg');el.textContent=t;el.className='msgline'+(c?' '+c:'');}
function renderHud(){
  document.getElementById('tick').textContent=Math.min(ticks,LEVELS[lvl].ticks);
  document.getElementById('tickMax').textContent=LEVELS[lvl].ticks;
  document.getElementById('ecoN').textContent=records.length;
  document.getElementById('att').textContent=records.length+1;
  document.getElementById('lv').textContent=lvl+1;
}
/* desenho */
function draw(){
  const W=L.W*TILE,H=L.H*TILE;
  if(cv.width!==W)cv.width=W;if(cv.height!==H)cv.height=H;
  ctx.clearRect(0,0,W,H);
  for(let r=0;r<L.H;r++)for(let c=0;c<L.W;c++){
    const ch=L.rows[r][c];const x=c*TILE,y=r*TILE;
    ctx.fillStyle=(r+c)%2?'#0f1730':'#0d1424';
    ctx.fillRect(x,y,TILE,TILE);
    if(ch==='#'){
      ctx.fillStyle='#39496e';ctx.fillRect(x,y,TILE,TILE);
      ctx.strokeStyle='#556a9e';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,TILE-1,TILE-1);
    }else if(ch==='P'){
      ctx.fillStyle='#223a20';ctx.beginPath();ctx.ellipse(x+TILE/2,y+TILE/2,TILE*.32,TILE*.22,0,0,7);ctx.fill();
      ctx.strokeStyle='#4d8a46';ctx.beginPath();ctx.ellipse(x+TILE/2,y+TILE/2,TILE*.32,TILE*.22,0,0,7);ctx.stroke();
      ctx.fillStyle='#4d8a46';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText('PLACA',x+TILE/2,y+TILE/2+3);
    }else if(ch==='D'){
      const dr=L.doors.find(d=>d.d[0]===r&&d.d[1]===c);
      const op=dr?dr.open:false;
      ctx.fillStyle=op?'#0f6b4a':'#43222a';ctx.fillRect(x+6,y+2,TILE-12,TILE-4);
      ctx.strokeStyle=op?'#6ee7b7':'#a0505c';ctx.strokeRect(x+6,y+2,TILE-12,TILE-4);
    }else if(ch==='G'){
      ctx.fillStyle='#0f6b4a';ctx.fillRect(x+4,y+4,TILE-8,TILE-8);
      ctx.strokeStyle='#6ee7b7';ctx.strokeRect(x+4,y+4,TILE-8,TILE-8);
      ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('SAÍDA',x+TILE/2,y+TILE/2+4);
    }else if(ch==='S'){
      ctx.fillStyle='rgba(122,165,255,.08)';ctx.fillRect(x,y,TILE,TILE);
    }
  }
  actors.forEach(a=>{
    const x=a.c*TILE+TILE/2,y=a.r*TILE+TILE/2;
    ctx.fillStyle=a.color;
    ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(x,y,TILE*.34,0,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=2;ctx.stroke();
    if(a.kind==='echo'){
      ctx.fillStyle='#ffd6f2';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
      ctx.fillText('E'+(actors.indexOf(a)),x,y+4);
    }else{
      ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('V',x,y+4);
    }
  });
  // trilha do jogador atual (futuro eco)
  if(you&&you.dirs.length>1){
    ctx.strokeStyle='rgba(122,165,255,.35)';ctx.lineWidth=2;ctx.setLineDash([3,5]);
    let r=you.r,c=you.c;ctx.beginPath();ctx.moveTo(c*TILE+TILE/2,r*TILE+TILE/2);
    for(let i=you.dirs.length-1;i>=0;i--){
      r-=you.dirs[i][0];c-=you.dirs[i][1];
      ctx.lineTo(c*TILE+TILE/2,r*TILE+TILE/2);
    }
    ctx.stroke();ctx.setLineDash([]);
  }
}
function loop(ts){
  const dt=Math.min(.08,(ts-lastTs)/1000||0);
  lastTs=ts;
  acc+=dt*1000;
  while(acc>=TICKMS){acc-=TICKMS;if(!over&&you)tick();}
  draw();
  raf=requestAnimationFrame(loop);
}
function ensureLoop(){if(!raf){lastTs=performance.now();raf=requestAnimationFrame(loop);}}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
/* UI */
(function(){
  const box=document.getElementById('stages');
  LEVELS.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='st'+(i+1<=unlock?'':' lock');
    b.textContent=i+1;b.disabled=i+1>unlock;
    if(i===lvl)b.classList.add('on');
    b.addEventListener('click',()=>goLevel(i));
    box.appendChild(b);
  });
})();
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
// controles touch
function addTouch(el,key){
  el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();keys[key]=true;});
  el.addEventListener('pointerup',e=>{keys[key]=false;});
  el.addEventListener('pointerleave',e=>{keys[key]=false;});
  el.addEventListener('pointercancel',e=>{keys[key]=false;});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
document.querySelectorAll('.dbtn').forEach(b=>addTouch(b,b.dataset.k));
document.getElementById('undoBtn').addEventListener('click',undoLast);
document.getElementById('rstBtn').addEventListener('click',()=>{sfx('click');resetLevel();});
document.getElementById('helpBtn').addEventListener('click',()=>{sfx('click');
  document.getElementById('resBox').innerHTML='<h2 style="color:var(--ac)">Como funciona o tempo</h2>'+
  '<p>Cada vez que você termina uma tentativa (chega à saída ou o tempo acaba), seu caminho vira um <b style="color:#ff8fd8">eco</b>. Na tentativa seguinte, todos os ecos repetem exatamente o que você fez — enquanto <b>você</b> age de novo.</p>'+
  '<p>Placas de pressão <b>P</b> abrem portas <b>D</b> enquanto alguém (você ou um eco) estiver em cima. Um eco parado em uma placa segura a porta aberta para você passar.</p>'+
  '<p>Use <span class="keys"><span class="k">←↑↓→</span></span> ou <span class="keys"><span class="k">WASD</span></span>. Se um eco atrapalhar, <b>desfaça o último</b> e refaça a tentativa.</p>'+
  '<div class="rowB"><button class="btn pri" onclick="document.getElementById(\'big\').classList.remove(\'open\')">Começar</button></div>';
  document.getElementById('big').classList.add('open');
});
resetLevel();
</script>
</body>
</html>
