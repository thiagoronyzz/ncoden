<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jogo 04 · Ecossistema Artificial — JogoZ</title>
<style>
  :root{--bg:#07130e;--panel:#0c1c14;--line:#1d3a2c;--txt:#e7f5ec;--mut:#86a894;--g:#3ddc97;--h:#ffcf6b;--p:#ff6b62;--w:#4db8ff;--ac:#ffe08a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;background:radial-gradient(900px 420px at 85% -10%,rgba(61,220,151,.1),transparent 60%),linear-gradient(180deg,var(--bg),#04090a);color:var(--txt);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(7,19,14,.93);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .top a{color:var(--g);text-decoration:none;font-weight:700;font-size:14px;padding:6px 10px;border-radius:8px;display:flex;gap:5px}
  .top a:hover{background:rgba(61,220,151,.1)}
  .ttl{font-weight:800}
  .sp{flex:1}
  .btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--g)}
  .wrap{max-width:1180px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
  canvas{width:100%;border-radius:12px;border:1px solid var(--line);background:#081409}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .stat{flex:1;min-width:118px;background:#0a1812;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .stat .l{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
  .stat b{font-size:19px;line-height:1.2;display:block}
  .stat small{font-size:10px;color:var(--mut)}
  .stat.water b{color:var(--w)} .stat.plant b{color:var(--g)} .stat.herb b{color:var(--h)} .stat.pred b{color:var(--p)}
  .bar{height:7px;border-radius:5px;background:#14301f;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
  .act{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .aBtn{text-align:left;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:#0c1c14;color:var(--txt);font-size:12.5px;line-height:1.4;position:relative}
  .aBtn b{display:block;font-size:13px}
  .aBtn small{color:var(--mut)}
  .aBtn:hover{border-color:var(--g)}
  .aBtn:disabled{opacity:.45;cursor:not-allowed}
  .aBtn .ct{position:absolute;top:-6px;right:-6px;background:var(--ac);color:#201c04;font-size:11px;font-weight:900;border-radius:999px;min-width:20px;height:20px;display:none;place-items:center}
  .aBtn .ct.on{display:grid}
  .ptsRow{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .pts{background:linear-gradient(135deg,#3ddc97,#1d8f63);color:#042310;font-weight:900;border-radius:10px;padding:4px 13px;font-size:16px}
  .qBtn{padding:10px 20px;border-radius:10px;border:0;font-weight:800;font-size:14px;background:linear-gradient(135deg,#3ddc97,#1d8f63);color:#042310;cursor:pointer;font-family:inherit}
  .qBtn.gray{background:#2a3a30;color:#ddeee2}
  .qBtn:disabled{opacity:.4;cursor:not-allowed}
  .log{max-height:250px;overflow:auto;font-size:12.5px;line-height:1.5;margin-top:8px}
  .log div{padding:5px 2px;border-bottom:1px dashed #163326;color:#bfd6c8}
  .log .ev{color:var(--ac)} .log .bad{color:var(--p)} .log .good{color:var(--g)} .log .act2{color:var(--w)}
  .season{font-size:13px;color:var(--mut);margin:8px 0 0}
  .season b{color:var(--ac)}
  .evBox{margin-top:8px;padding:9px 12px;border-radius:11px;font-size:13px;line-height:1.55}
  .evBox.warn{background:rgba(255,107,98,.08);border:1px solid rgba(255,107,98,.35)}
  .evBox.ok{background:rgba(61,220,151,.07);border:1px solid rgba(61,220,151,.3)}
  .bigmsg{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.82);z-index:80;padding:16px}
  .bigmsg.open{display:grid}
  .res{background:linear-gradient(160deg,#10241a,#0a1812);border:1px solid var(--g);border-radius:18px;max-width:520px;width:100%;padding:26px;text-align:center;max-height:88vh;overflow:auto}
  .res h2{font-size:23px;margin-bottom:8px}
  .res p{color:#cfe7d8;line-height:1.65;font-size:14px;margin:6px 0;text-align:left}
  .rowB{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .bar3{margin-top:4px}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html">← JogoZ</a><span class="ttl">04 · Ecossistema Artificial</span><span class="sp"></span>
  <span style="font-size:13px;color:var(--mut)">Semana <b id="wk" style="color:#fff">1</b>/52</span>
  <button class="btn" id="helpBtn">Como jogar</button>
  <button class="btn" id="rstBtn">Recomeçar</button>
</header>
<div class="wrap">
  <main>
    <div class="panel">
      <h3>Visão geral do ecossistema</h3>
      <div class="stats" id="stats"></div>
      <canvas id="cv" height="230"></canvas>
      <div class="season" id="season"></div>
      <div class="evBox" id="evBox"></div>
    </div>
    <div class="panel" style="margin-top:14px">
      <h3>Plano da semana (ações se aplicam ao avançar a semana)</h3>
      <div class="ptsRow"><span style="font-size:14px">Ações: <span class="pts" id="pts">3</span>/3</span>
        <button class="qBtn" id="nextBtn">Avançar semana →</button>
        <span id="noteAct" style="font-size:12px;color:var(--mut)"></span></div>
      <div class="act" id="acts"></div>
    </div>
  </main>
  <aside>
    <div class="panel">
      <h3>Diário de campo</h3>
      <div class="log" id="log"></div>
    </div>
  </aside>
</div>
<div class="bigmsg" id="big"><div class="res" id="resBox"></div></div>
<script>
"use strict";
/* ===== áudio (Web Audio) ===== */
let AC=null;
function tone(f,d,type,g,when){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(when||0),o=AC.createOscillator(),v=AC.createGain();o.type=type||'square';o.frequency.value=f;v.gain.value=g||.04;o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d);o.onended=function(){o.disconnect();v.disconnect();};}catch(e){}}
function sfx(k){if(k==='click')tone(500,.05,'square',.03);else if(k==='ok'){tone(600,.1,'square',.05);tone(900,.15,'square',.05,.09);}else if(k==='bad'){tone(180,.2,'sawtooth',.05);}else if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.15,'square',.05,i*.12));}else if(k==='ev'){tone(320,.14,'sine',.05);tone(220,.18,'sine',.05,.12);}}
document.addEventListener('pointerdown',function(){if(AC&&AC.state==='suspended')AC.resume();},{once:true});

/* ===== estado persistente ===== */
const PREF='jzP04';
function load(){try{const v=localStorage.getItem(PREF);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(PREF,JSON.stringify({played:true,best:best,win:state?state.win:false}));}catch(e){}}
let best=0,state=null;
(function(){const s=load();if(s)best=s.best||0;})();

const CLAMP=(x,a,b)=>Math.max(a,Math.min(b,x));
const SEASONS=['primavera','verão','outono','inverno'];
const season=()=>SEASONS[seasonIdx];
let seasonIdx=0,week=1,actionsLeft=0,nextEv=3,gameOver=false,msgQueue=[],hist=[];
let weekActs={plantar:0,introH:0,liberarPred:0,cacar:0,irrigar:0,adubo:0,vacina:0,shield:0};
let barrier=0;

function newGame(){
  state={w:74,p:80,h:28,d:6,win:false,stability:0};
  seasonIdx=0;week=1;nextEv=3;gameOver=false;barrier=0;
  actionsLeft=3;weekActs={plantar:0,introH:0,liberarPred:0,cacar:0,irrigar:0,adubo:0,vacina:0,shield:0};
  hist=[{w:74,p:80,h:28,d:6}];
  msgQueue=['🌱 Ecossistema montado: 80% de cobertura vegetal, 28 herbívoros, 6 predadores, água em 74%.','📋 Mantenha os três níveis da cadeia vivos por 52 semanas.'];
}

/* ===== modelo semanal ===== */
function weeklySim(){
  const s=state; const A=weekActs;
  const dif=Math.min(3.0,1+week/22); // dificuldade progressiva
  let msgs=[]; let notes=[];
  // água: chuva sazonal + ações
  const rainBase={primavera:24,verão:14,outono:21,inverno:29}[season()];
  const rain=CLAMP(rainBase*CLAMP(1.5-dif*0.32,0.35,1.2)+(Math.random()*20-10),0,50);
  const heat={primavera:.45,verão:1.35,outono:.55,inverno:.3}[season()];
  const irrig=(A.irrigar||0)*7;
  s.w=CLAMP(s.w+rain-(s.w*(0.08+heat*0.10))-s.p*0.028+irrig,0,100);
  // plantas
  let gr=0.055+(s.w>22&&s.w<94?0.05:0.01)-(heat>1?.02:0)+(A.adubo?0.04*A.adubo:0);
  if(s.w<16)gr-=0.10;
  const graze=Math.min(s.p*0.30,s.h*(0.62+0.006*s.w));
  const gPlant=s.p*gr;
  s.p=CLAMP(s.p+gPlant-graze+(A.plantar?7*A.plantar:0),0,100);
  // herbívoros
  const foodPerH=s.h>0.5?s.p/s.h:8;
  let hDel=0;
  if(foodPerH>1.05)hDel+=s.h*0.115*(1+heat*0.15); else if(foodPerH>0.5)hDel+=s.h*0.01; else hDel-=s.h*0.16;
  if(foodPerH<0.42)hDel-=s.h*0.20;
  if(s.p<6)hDel-=s.h*0.10;
  if(!A.vacina&&week>5&&Math.random()<0.16)hDel-=s.h*0.07;
  const killByD=Math.min(s.h,s.d*(0.30+0.013*s.h));
  hDel-=killByD;
  s.h=CLAMP(s.h+hDel+(A.introH?4*A.introH:0),0,300);
  // predadores
  const preyPerD=s.d>0.5?s.h/s.d:10;
  let dDel=0;
  if(preyPerD>3.2)dDel+=s.d*0.09*(0.8+heat*0.2); else if(preyPerD>1.2)dDel+=s.d*0.01; else dDel-=s.d*0.14;
  if(preyPerD<0.8)dDel-=s.d*0.2;
  dDel-=(A.cacar?Math.ceil(s.d*0.22*(A.cacar||0)+0.6*(A.cacar||0)):0);
  s.d=CLAMP(s.d+dDel+(A.liberarPred?2*A.liberarPred:0),0,120);
  // ações registram
  if(A.plantar)notes.push('Reflorestamento (+'+7*A.plantar+' biomassa).');
  if(A.introH)notes.push('Soltos '+4*A.introH+' herbívoros.');
  if(A.liberarPred)notes.push('Introduzidos '+2*A.liberarPred+' predadores.');
  if(A.cacar)notes.push('Caça controlada executada.');
  if(A.irrigar)notes.push('Irrigação: +'+irrig+' de água.');
  if(A.adubo)notes.push('Solo adubado.');
  if(A.vacina)notes.push('Campanha de vacinação.');
  if(A.shield){barrier=1;notes.push('🛡 Barreiras de contenção armadas.');}
  msgs.push('🌦 Semana '+week+': chuva '+Math.round(rain)+' mm'+(heat>1?' (calor intenso)':'')+(notes.length?' · '+notes.join(' '):''));
  return msgs;
}
function runEvent(){
  const types=['seca','praga','calor','frio','invasor','vento','chuva'];
  const pick=types[Math.floor(Math.random()*types.length)];
  const shield=barrier>0; if(barrier>0)barrier--;
  const dif=Math.min(3.0,1+week/22);
  const m=(shield?0.45:1)*(1+(dif-1)*0.5);
  let txt='';
  if(pick==='seca'){state.w=CLAMP(state.w-20*m,0,100);state.p=CLAMP(state.p-10*m,0,100);txt='Seca prolongada drenou a água e murchou o pasto.';}
  else if(pick==='praga'){state.p=CLAMP(state.p-22*m,0,100);txt='Praga de insetos devorou parte da vegetação.';}
  else if(pick==='calor'){state.w=CLAMP(state.w-12*m,0,100);state.h=CLAMP(state.h+Math.round(3*m),0,300);txt='Onda de calor acelerou a reprodução dos herbívoros e evaporou água.';}
  else if(pick==='frio'){state.h=CLAMP(state.h-Math.round(state.h*0.15*m),0,300);state.d=CLAMP(state.d-Math.round(state.d*0.1*m),0,120);txt='Frente fria matou filhotes e reduziu as populações.';}
  else if(pick==='invasor'){state.d=CLAMP(state.d+3,0,120);txt='Predador invasor entrou no território.';}
  else if(pick==='vento'){state.p=CLAMP(state.p-13*m,0,100);txt='Ventos fortes derrubaram árvores.';}
  else if(pick==='chuva'){state.w=CLAMP(state.w+16,0,100);txt='Chuvas torrenciais encheram o reservatório.';}
  msgQueue.push('⚡ Evento: '+txt+(shield?' (barreiras reduziram o dano)':''));
  sfx('ev');
}
function endWeek(){
  if(gameOver)return;
  msgQueue=weeklySim().concat(msgQueue);
  if(week>=nextEv){runEvent();nextEv=week+Math.max(1,Math.round(2+Math.random()*3-(dif-1)*0.8));}
  if(week%13===0&&week<52){seasonIdx=(seasonIdx+1)%4;msgQueue.unshift('🍂 Nova estação: '+season()+'. O clima muda.');}
  hist.push({w:Math.round(state.w),p:Math.round(state.p),h:Math.round(state.h),d:Math.round(state.d)});
  actionsLeft=3;
  weekActs={plantar:0,introH:0,liberarPred:0,cacar:0,irrigar:0,adubo:0,vacina:0,shield:0};
  week++;
  renderAll();
  checkGame();
}

/* ===== fim de jogo ===== */
function showModal(html){document.getElementById('resBox').innerHTML=html;document.getElementById('big').classList.add('open');}
function checkGame(){
  const s=state;
  const ext=[];
  if(s.p<1.5&&week>2)ext.push('Plantas');
  if(s.h<1.5&&week>4)ext.push('Herbívoros');
  if(s.d<1.5&&week>4)ext.push('Predadores');
  if(ext.length&&week<=52){
    gameOver=true;
    msgQueue.unshift('💀 COLAPSO: '+ext.join(' e ')+' extintas.');
    sfx('bad');
    renderAll();
    if(week-1>best){best=week-1;save();}
    setTimeout(()=>showModal('<h2 style="color:var(--p)">☠ O ecossistema colapsou</h2><p>Na semana <b>'+(week-1)+'</b>, '+ext.join(' e ').toLowerCase()+' sumiram do território. Sem elas, a cadeia alimentar se rompeu.</p><p>Você manteve o sistema vivo por <b>'+(week-1)+' semanas</b>.'+(week-1>=best?' <b style="color:var(--ac)">Recorde!</b>':' Recorde: '+best)+'</p><div class="rowB"><button class="qBtn" onclick="restart()">Recomeçar</button><button class="qBtn gray" onclick="closeBig()">Ver gráfico</button></div>'),300);
    return;
  }
  if(week>52){
    gameOver=true;
    const ok=state.w>12&&state.p>20&&state.h>3&&state.d>=0.5;
    if(ok){
      const stab=Math.round(state.w*.15+state.p*.4+Math.min(150,state.h*1.5)*.3+Math.min(150,state.d*8)*.15);
      state.stability=stab;state.win=true;
      const score=stab+52;
      if(score>best){best=score;}
      save();sfx('win');
      renderAll();
      setTimeout(()=>showModal('<h2 style="color:var(--g)">🏆 Ano completo — ecossistema estável!</h2><p>As quatro variáveis (água, plantas, herbívoros e predadores) sobreviveram 52 semanas com equilíbrio.</p><p>Estabilidade: <b>'+stab+'/100</b> · Pontuação: <b>'+score+'</b>'+(score>=best?' · <b style="color:var(--ac)">novo recorde</b>':' · recorde: '+best)+'</p><div class="rowB"><button class="qBtn" onclick="restart()">Jogar de novo</button><button class="qBtn gray" onclick="document.location=\'index.html\'">Voltar</button></div>'),300);
    }else{
      renderAll();
      setTimeout(()=>showModal('<h2 style="color:var(--ac)">⏰ O ano terminou em desequilíbrio</h2><p>Nenhuma espécie morreu, mas o sistema terminou degradado demais para ser considerado estável.</p><p>Dica: mantenha a água entre 25 e 90, a vegetação acima de 30 e evite deixar predadores sem presas.</p><div class="rowB"><button class="qBtn" onclick="restart()">Tentar de novo</button></div>'),300);
    }
  }
}
function closeBig(){document.getElementById('big').classList.remove('open');}
function restart(){closeBig();sfx('click');newGame();renderAll();}

/* ===== interface ===== */
const CV=document.getElementById('cv');
const ctx=CV.getContext('2d');
function drawChart(){
  ctx.clearRect(0,0,CV.width,CV.height);
  ctx.fillStyle='#081409';ctx.fillRect(0,0,CV.width,CV.height);
  if(!hist.length)return;
  const maxV=Math.max(120,...hist.map(h=>Math.max(h.w,h.p,h.h*2,h.d*8)));
  const x0=30,x1=CV.width-6,y0=8,y1=CV.height-26;
  ctx.strokeStyle='#1c3d29';ctx.lineWidth=1;ctx.fillStyle='#86a894';ctx.font='10px sans-serif';ctx.textAlign='right';
  for(let i=0;i<=4;i++){const yy=y0+(y1-y0)*i/4;ctx.beginPath();ctx.moveTo(x0,yy);ctx.lineTo(x1,yy);ctx.stroke();ctx.fillText(Math.round(maxV*(1-i/4)),x0-4,yy+3);}
  const series={p:'#3ddc97',h:'#ffcf6b',d:'#ff6b62',w:'#4db8ff'};
  for(const k in series){
    ctx.strokeStyle=series[k];ctx.lineWidth=2;ctx.beginPath();
    hist.forEach((pt,i)=>{const v=pt[k]*(k==='d'?8:k==='h'?2:1);
      const xx=x0+(x1-x0)*i/Math.max(1,hist.length-1);
      const yy=y1-(y1-y0)*Math.min(1,v/maxV);
      i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);});
    ctx.stroke();
  }
  ctx.fillStyle='#86a894';ctx.textAlign='left';
  const lab=[['p','Plantas','#3ddc97'],['h','Herbívoros','#ffcf6b'],['d','Predadores (×8)','#ff6b62'],['w','Água','#4db8ff']];
  let lx=8;
  lab.forEach(([k,t,c])=>{ctx.fillStyle=c;ctx.fillRect(lx,y1+8,11,3);ctx.fillStyle='#86a894';ctx.fillText(t,lx+14,y1+11);lx+=ctx.measureText(t).width+30;});
}
function renderAll(){
  if(!state)return;
  document.getElementById('wk').textContent=Math.min(week,52);
  document.getElementById('pts').textContent=actionsLeft;
  const difTxt=['calmo','moderado','intenso','extremo'][Math.min(3,Math.floor(week/13))];
  document.getElementById('season').innerHTML='Estação: <b style="text-transform:capitalize">'+season()+'</b> · clima '+difTxt+(barrier>0?' · <b style="color:var(--ac)">🛡 barreiras armadas</b>':'');
  // stats
  const st=document.getElementById('stats');st.innerHTML='';
  const items=[['Água','w',state.w,100,'#4db8ff'],['Plantas','p',state.p,100,'#3ddc97'],['Herbívoros','h',state.h,300,'#ffcf6b'],['Predadores','d',state.d,120,'#ff6b62']];
  const prev=hist[hist.length-2];
  items.forEach(([l,k,v,mx,c])=>{
    const dv=prev?(v-prev[k]):0;
    const d=document.createElement('div');
    d.className='stat '+(k==='w'?'water':k==='p'?'plant':k==='h'?'herb':'pred');
    d.innerHTML='<div class="l"><span>'+l+'</span><span style="font-size:11px;color:'+(dv>0?'var(--g)':dv<0?'var(--p)':'var(--mut)')+'">'+(dv>0?'▲':dv<0?'▼':'•')+'</span></div><b>'+Math.round(v)+'</b><small>máx '+mx+'</small><div class="bar"><i style="width:'+CLAMP(v/mx*100,0,100)+'%;background:'+c+'"></i></div>';
    st.appendChild(d);
  });
  // ações
  const A=[
    {id:'plantar',t:'🌿 Reflorestar',d:'+7 biomassa vegetal'},
    {id:'introH',t:'🐇 Reintroduzir herbívoros',d:'+4 herbívoros'},
    {id:'liberarPred',t:'🐆 Repovoar predadores',d:'+2 predadores'},
    {id:'cacar',t:'🏹 Caça controlada',d:'−22% dos predadores'},
    {id:'irrigar',t:'💧 Irrigar a pradaria',d:'+7 de água (por ação)'},
    {id:'adubo',t:'🧪 Adubar o solo',d:'acelera o crescimento'},
    {id:'vacina',t:'💉 Vacinar herbívoros',d:'imuniza contra doenças'},
    {id:'shield',t:'🛡 Montar barreiras',d:'reduz o próximo evento'}
  ];
  const box=document.getElementById('acts');box.innerHTML='';
  A.forEach(a=>{
    const b=document.createElement('button');
    b.className='aBtn';b.innerHTML='<b>'+a.t+'</b><small>'+a.d+'</small><span class="ct">×0</span>';
    const ct=b.querySelector('.ct');
    const upd=()=>{const n=weekActs[a.id];ct.textContent='×'+n;ct.classList.toggle('on',n>0);b.disabled=actionsLeft<=0;};
    b.addEventListener('click',()=>{
      if(actionsLeft<=0)return;
      actionsLeft--;weekActs[a.id]++;
      sfx('ok');upd();renderPoints();
    });
    box.appendChild(b);upd();
  });
  renderPoints();
  const log=document.getElementById('log');
  log.innerHTML=msgQueue.slice(0,40).map(m=>{
    let cls='';
    if(m.indexOf('💀')===0)cls='bad';else if(m.indexOf('⚡')===0)cls='ev';
    else if(m.indexOf('🍂')===0||m.indexOf('🌱')===0||m.indexOf('📋')===0)cls='good';
    else if(m.indexOf('🛠')===0||m.indexOf('🛡')===0)cls='act2';
    return '<div class="'+cls+'">'+m+'</div>';
  }).join('');
  // alertas
  const al=[];
  if(state.w<20)al.push('⚠ Água crítica — irrigue já ou a vegetação vai murchar.');
  if(state.p<18&&state.h>8)al.push('⚠ Pasto escasso: refloreste ou reduza os herbívoros.');
  if(state.d>state.h*0.55&&state.h>5)al.push('⚠ Predadores em excesso: a caça controlada evita o colapso das presas.');
  if(state.h<4&&state.d>4)al.push('⚠ Predadores sem presas vão morrer de fome — ou virar o problema.');
  if(state.p>85&&state.w>85)al.push('ℹ Tudo abundante: ótimo momento para reforçar herbívoros.');
  const ev=document.getElementById('evBox');
  ev.className='evBox '+(al.length?'warn':'ok');
  ev.innerHTML=al.length?al.join('<br>'):'✅ Sistema dentro da faixa de estabilidade observada.';
  drawChart();
}
function renderPoints(){
  document.getElementById('pts').textContent=actionsLeft;
  const n=document.getElementById('noteAct');
  const totalAct=Object.values(weekActs).reduce((a,b)=>a+b,0);
  n.textContent=actionsLeft<=0?'Ações planejadas. Clique em “Avançar semana”.':('Planejadas: '+totalAct+' · faltam '+actionsLeft);
}
document.getElementById('nextBtn').addEventListener('click',endWeek);
document.getElementById('helpBtn').addEventListener('click',()=>{
  sfx('click');
  showModal('<h2 style="color:var(--g)">Como jogar</h2><p>Você administra um <b>ecossistema artificial</b> por 52 semanas. Plantas alimentam herbívoros; herbívoros alimentam predadores; a água limita todos. Se um nível sumir, o sistema <b>colapsa</b>.</p><p><b>Cada semana</b> você tem 3 ações (reflorestar, reintroduzir espécies, caça controlada, irrigar, adubar, vacinar, barreiras). Depois clique em <b>Avançar semana</b> e o modelo simula chuva, estações e eventos (seca, pragas, ondas de calor, invasores…).</p><p>Meta: terminar 52 semanas com todos os níveis vivos e estáveis. A dificuldade do clima cresce com o tempo.</p><div class="rowB"><button class="qBtn" onclick="closeBig()">Entendi</button></div>');
});
document.getElementById('rstBtn').addEventListener('click',restart);
newGame();renderAll();
</script>
</body>
</html>
