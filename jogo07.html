<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jogo 07 · Ilha Mutante — JogoZ</title>
<style>
  :root{--bg:#0a1712;--panel:#0f2018;--line:#1f4432;--txt:#e4f6ea;--mut:#7da88f;--g:#4ade80;--ac:#ffd166;--bad:#ff7a72;--o:#7aa5ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;background:radial-gradient(900px 420px at 85% -10%,rgba(74,222,128,.12),transparent 60%),linear-gradient(180deg,var(--bg),#050d09);color:var(--txt);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(10,23,18,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .top a{color:var(--g);text-decoration:none;font-weight:700;font-size:14px;padding:6px 10px;border-radius:8px;display:flex;gap:5px}
  .top a:hover{background:rgba(74,222,128,.1)}
  .ttl{font-weight:800}
  .sp{flex:1}
  .btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--g)}
  .wrap{max-width:1150px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
  .island{position:relative;height:120px;border-radius:14px;background:linear-gradient(180deg,#7dd3a8,#2f7a52 70%,#cfe8d8 70%,#b3d9e6);border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
  .island .sea{position:absolute;inset:auto 0 0 0;height:34%;background:#b3d9e6}
  .popbar{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.35);padding:6px 11px;border-radius:10px;font-size:12px}
  .popbar b{color:var(--ac);font-size:16px}
  .cre{position:absolute;left:60px;top:34px;font-size:40px;transition:all .5s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
  .year{border-radius:10px;padding:4px 10px;background:rgba(74,222,128,.12);color:var(--g);font-weight:800}
  .traits{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
  .tchip{padding:6px 10px;border-radius:99px;font-size:12px;background:#13281d;border:1px solid #2b4f3a;color:#b9e8cb;cursor:pointer}
  .tchip:hover{border-color:var(--g)}
  .tchip.act{background:linear-gradient(135deg,#4ade80,#1f8f5a);color:#04150b;border:0;font-weight:700}
  .tchip:disabled{opacity:.4;cursor:not-allowed}
  .tpool{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px}
  .tcard{border:1px solid var(--line);background:#0d1c14;border-radius:12px;padding:10px}
  .tcard b{color:var(--g)}
  .tcard .pf{color:var(--ac)}
  .tcard .ng{color:var(--bad)}
  .tcard p{font-size:12px;color:#c3e3cf;margin:4px 0}
  .selTrait{background:rgba(255,209,102,.12);border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
  .log{max-height:300px;overflow:auto;font-size:12.5px;line-height:1.55;margin-top:8px}
  .log div{padding:6px 2px;border-bottom:1px dashed #1c3a29}
  .log .cr{color:var(--o)} .log .ok{color:var(--g)} .log .bad{color:var(--bad)} .log .g{color:var(--ac)}
  .phase{margin:10px 0;padding:11px;border-radius:12px;font-size:13.5px;line-height:1.6;background:#0d1c14;border:1px solid var(--line)}
  .phase b{color:var(--ac)}
  .bigmsg{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.85);z-index:80;padding:16px}
  .bigmsg.open{display:grid}
  .res{background:linear-gradient(160deg,#13291d,#0d1c14);border:1px solid var(--g);border-radius:18px;max-width:520px;width:100%;padding:24px;max-height:88vh;overflow:auto}
  .res h2{margin-bottom:8px}
  .res p{line-height:1.65;font-size:13.5px;color:#d9eedf;margin:7px 0}
  .rowB{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .big{padding:30px}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html">← JogoZ</a><span class="ttl">07 · Ilha Mutante</span><span class="sp"></span>
  <button class="btn" id="helpBtn">Manual</button>
  <button class="btn" id="rstBtn">Reiniciar</button>
</header>
<div class="wrap">
  <main>
    <div class="panel">
      <div class="island">
        <div class="popbar">População: <b id="pop">0</b> · <span id="yrTxt"></span></div>
        <div class="cre" id="cre">🦎</div>
      </div>
      <div class="phase" id="phaseBox"></div>
      <div id="choiceBox"></div>
      <div class="log" id="log"></div>
    </div>
  </main>
  <aside>
    <div class="panel">
      <h3>Sua espécie · genes ativos (max 6)</h3>
      <div class="traits" id="activeTraits"></div>
      <p style="font-size:12px;color:var(--mut);line-height:1.5">A cada ano você pode <b>adicionar um gene</b> ou <b>trocar um gene ativo</b> por um novo. Depois, sua espécie enfrenta as crises do ano.</p>
    </div>
    <div class="panel" style="margin-top:12px">
      <h3>Fonte gênica disponível</h3>
      <div class="tpool" id="tpool"></div>
    </div>
  </aside>
</div>
<div class="bigmsg" id="big"><div class="res" id="resBox"></div></div>
<script>
"use strict";
let AC=null;
function tone(f,d,type,g,when){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(when||0),o=AC.createOscillator(),v=AC.createGain();o.type=type||'square';o.frequency.value=f;v.gain.value=g||.04;o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d);o.onended=function(){o.disconnect();v.disconnect();};}catch(e){}}
function sfx(k){if(k==='ok'){tone(640,.09,'square',.05);tone(960,.14,'square',.05,.08);}else if(k==='bad')tone(190,.22,'sawtooth',.05);else if(k==='click')tone(480,.04,'square',.03);else if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.15,'square',.05,i*.11));}else if(k==='cr')tone(300,.12,'sine',.05);}
document.addEventListener('pointerdown',function(){if(AC&&AC.state==='suspended')AC.resume();},{once:true});
const PREF='jzP07';
function load(){try{const v=localStorage.getItem(PREF);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(PREF,JSON.stringify({played:true,best:best,win:state?state.win:false}));}catch(e){}}
let best=0;
(function(){const s=load();if(s)best=s.best||0;})();
const CRISES=[
 {id:'seca',ic:'☀️',n:'Seca',d:'A ilha não vê chuva há meses. A água some e o alimento seca.',base:.5,traits:{resist:1.5,metab:1.4,forrag:1.2},anti:{repro:.85,rapid:.9}},
 {id:'frio',ic:'❄️',n:'Onda de frio',d:'Uma corrente gelada congela a costa durante semanas.',base:.45,traits:{metab:1.6,resist:1.4,visao:1.1},anti:{repro:.85}},
 {id:'predador',ic:'🦅',n:'Novo predador',d:'Aves de rapina migraram para a ilha e caçam dia e noite.',base:.42,traits:{defesa:1.8,camuflagem:1.7,rapid:1.3,visao:1.15},anti:{repro:.9}},
 {id:'fome',ic:'🍂',n:'Escassez de alimento',d:'A fruta nativa falhou. Só sobra o que poucos conseguem comer.',base:.48,traits:{forrag:1.7,metab:1.5},anti:{repro:.85,rapid:.9}},
 {id:'tempestade',ic:'🌊',n:'Tempestades',d:'Ventos e ondas devastam o litoral por semanas.',base:.55,traits:{defesa:1.3,rapid:1.3,resist:1.2},anti:{metab:.95}},
 {id:'noite',ic:'🌘',n:'Noites eternas',d:'Nuvens cobrem a ilha e a escuridão vira o novo normal.',base:.5,traits:{visao:1.6,camuflagem:1.3,metab:1.1},anti:{forrag:.9}},
 {id:'praga',ic:'🦟',n:'Praga de parasitas',d:'Parasitas atacam quem tem filhotes ou feridas.',base:.55,traits:{defesa:1.2,metab:1.2,rapid:1.1},anti:{repro:.9}}];
const TRAITS=[
 {id:'rapid',n:'Patas rápidas',ic:'⚡',d:'Corre de predadores e tempestades.',pf:'foge de predadores',ng:'gasta mais energia (fome)',
  stat:{rapid:1,metab:.92}},
 {id:'resist',n:'Pele resistente',ic:'🛡️',d:'Aguenta seca, frio e impacto.',pf:'sobrevive a clima extremo',ng:'corpo pesado (-velocidade)',stat:{resist:1,rapid:.92}},
 {id:'visao',n:'Olhos aguçados',ic:'👁️',d:'Enxerga comida e perigo no escuro.',pf:'melhor em noites e névoas',ng:'gestação mais longa',stat:{visao:1,repro:.93}},
 {id:'repro',n:'Gestação curta',ic:'🥚',d:'Mais filhotes por ano.',pf:'população cresce rápido',ng:'mais bocas para alimentar',stat:{repro:1,forrag:.92}},
 {id:'forrag',n:'Dieta ampla',ic:'🌿',d:'Come de tudo: fruta, casca, raiz, inseto.',pf:'passa bem na fome',ng:'perde velocidade ao forragear',stat:{forrag:1,rapid:.95}},
 {id:'defesa',n:'Carapaça',ic:'🐢',d:'Couraça contra predadores e ondas.',pf:'protege dos ataques',ng:'lenta e faminta',stat:{defesa:1,rapid:.85,forrag:.9}},
 {id:'metab',n:'Metabolismo lento',ic:'🐌',d:'Precisa de pouca comida e suporta frio.',pf:'ótimo para fome e frio',ng:'muito lento e menos filhotes',stat:{metab:1,rapid:.85,repro:.92}},
 {id:'camuflagem',n:'Camuflagem',ic:'🦎',d:'Pele muda de cor com o ambiente.',pf:'some de predadores',ng:'gasta energia (menos filhotes)',stat:{camuflagem:1,repro:.94}}];
/* estado de jogo */
const MAXG=6, YEARS=12;
let state=null,phase='choose',active=[],year=1,pop=0,seedDone=[],logA=[],traitBought=false;
function rndCrisis(){
  // crises pioram levemente com o tempo
  const w=CRISES.map(c=>({c,w:1+(year>4?.4:0)+(year>8?.4:0)}));
  const tot=w.reduce((a,x)=>a+x.w,0);
  let r=Math.random()*tot;
  for(const x of w){r-=x.w;if(r<=0)return x.c;}
  return CRISES[0];
}
function newRun(){
  state={pop:60,win:false};pop=60;year=1;active=['repro'];traitBought=false;
  seedDone=[];logA=[];
  log('🌱 <b>Ano 1.</b> Sua espécie de lagartos chega à ilha com 60 indivíduos e um gene básico: gestação curta.','g');
  phase='adapt';renderAll();
}
function log(html,cls){logA.unshift('<div class="'+(cls||'')+'">'+html+'</div>');const el=document.getElementById('log');el.innerHTML=logA.slice(0,60).join('');}
function selTrait(t){
  if(phase!=='adapt')return;
  if(traitBought){log('🧬 Você já ativou um gene este ano. Inicie o ano ou troque um gene ativo.','');sfx('bad');return;}
  if(active.includes(t.id))return;
  if(active.length<MAXG){active.push(t.id);afterAdapt();}
  else{
    // troca: abre seletor
    swapTrait=t;
    renderAll();setPhaseNote('Escolha qual gene ativo será substituído por <b>'+t.n+'</b>:');
  }
}
let swapTrait=null;
function afterAdapt(){
  if(!traitBought){traitBought=true;log('🧬 Novo gene ativado: <b>'+tr(active[active.length-1]).n+'</b>.','g');}
  sfx('ok');swapTrait=null;renderAll();
}
function replaceActive(id){
  if(swapTrait){active[active.indexOf(id)]=swapTrait.id;log('🧬 <b>'+tr(swapTrait.id).n+'</b> substituiu <b>'+tr(id).n+'</b>.','g');sfx('ok');swapTrait=null;renderAll();}
}
function runYear(){
  if(phase!=='adapt')return;
  if(!traitBought){log('💡 Você não ativou gene novo este ano — pode seguir, mas a seleção natural não espera.','');}
  phase='sim';traitBought=false;
  const nCrisis=2+(year>6?1:0);
  log('⏳ <b>Ano '+year+'</b> começou: '+nCrisis+' desafios à frente.','');
  simYear(nCrisis);
}
function tr(id){return TRAITS.find(t=>t.id===id);}
function statSum(key){return 1+active.reduce((a,id)=>a+(tr(id).stat[key]||1)-1,0);}
function simYear(n){
  for(let i=0;i<n;i++){
    const c=JSON.parse(JSON.stringify(rndCrisis()));
    // surpresa: raro um segundo evento no mesmo ano?
    const sc=calcSurvival(c);
    const died=Math.round(pop*(1-sc));
    const surv=Math.max(0,pop-died);
    log((sc>=0.8?'✅':'⚠️')+' '+c.ic+' <b>'+c.n+'</b> — sobreviveram '+surv+' de '+pop+' ('+Math.round(sc*100)+'%).','cr');
    sfx('cr');
    pop=surv;
    if(pop<=0)break;
    seedDone.push(c.id);
  }
  if(pop<=0){log('💀 A espécie foi extinta no ano '+year+'.','bad');sfx('bad');phase='over';endRun(false);renderAll();return;}
  // reprodução entre anos
  const repro=0.55+0.55*(statSum('repro')-1)+ (active.includes('forrag')?0.1:0);
  const foodCap=1-0.05*(active.includes('repro')?1:0)-0.05*(active.includes('defesa')?1:0);
  const base=Math.max(0.2,repro*foodCap);
  const next=Math.min(400,Math.max(pop*0.4,pop*base));
  log('🌿 Reprodução: '+Math.round(pop)+' → <b>'+Math.round(next)+'</b> indivíduos.','ok');
  pop=Math.round(next);
  if(year>=YEARS){phase='over';endRun(true);renderAll();return;}
  year++;phase='adapt';traitBought=false;
  renderAll();
}
function calcSurvival(c){
  let sc=c.base;
  // começa dos traços
  const stats=['rapid','resist','visao','forrag','defesa','metab','camuflagem','repro'];
  stats.forEach(s=>{
    const mult=statSum(s)-1;
    if(mult>0&&(c.traits[s]))sc+=0.30*c.traits[s]*(1-Math.exp(-mult));
    if(c.anti&&c.anti[s])sc*=(1-Math.min(.45,mult*0.3*c.anti[s]));
  });
  // população pequena sofre mais
  if(pop<15)sc*=0.85;
  return Math.min(.96,Math.max(.12,sc));
}
function endRun(win){
  state.win=win;
  const score=win?Math.round(pop+year*30+active.length*25):year*10;
  if(score>best)best=score;
  save();
  document.getElementById('resBox').innerHTML=
    (win?'<h2 style="color:var(--g)">🏆 Ano '+YEARS+' — sua espécie domina a ilha!</h2>':'<h2 style="color:var(--bad)">☠ Extinção no ano '+year+'</h2>')+
    '<p>'+(win?'A população final é de <b>'+pop+'</b> indivíduos e os genes escolhidos formaram uma linhagem resiliente.':'Os eventos da ilha venceram sua linhagem. Cada gene é uma aposta — e o ambiente decide.')+'</p>'+
    '<p>Pontuação: <b>'+score+'</b>'+(score>=best?' · <b style="color:var(--ac)">recorde!</b>':' · recorde '+best)+'</p>'+
    '<p style="font-size:12px;color:var(--mut)">Genes ativos: '+active.map(id=>tr(id).n).join(', ')+'</p>'+
    '<div class="rowB"><button class="btn" style="background:var(--g);color:#04150b;font-weight:800;border:0" onclick="restart()">Nova linhagem</button><button class="btn" onclick="closeBig()">Ver histórico</button></div>';
  document.getElementById('big').classList.add('open');
  sfx(win?'win':'bad');
}
function restart(){document.getElementById('big').classList.remove('open');newRun();}
function closeBig(){document.getElementById('big').classList.remove('open');}
function renderAll(){
  if(!state)return;
  document.getElementById('pop').textContent=pop;
  document.getElementById('yrTxt').textContent='Ano '+Math.min(year,YEARS)+'/'+YEARS;
  document.getElementById('cre').textContent=active.includes('defesa')?'🦖':active.includes('camuflagem')?'🦎':'🦎';
  // traços ativos
  const at=document.getElementById('activeTraits');at.innerHTML='';
  active.forEach(id=>{
    const t=tr(id);
    const chip=document.createElement('span');
    chip.className='tchip act';
    chip.textContent=t.ic+' '+t.n;
    at.appendChild(chip);
  });
  // fase box
  const pb=document.getElementById('phaseBox');
  if(phase==='adapt'){
    pb.innerHTML=(swapTrait?'<b>Troca de gene:</b> escolha qual gene ativo remover (ou toque no gene para manter).':'<b>Ano '+year+' — adaptação.</b> Sua espécie está pronta. Ative um gene novo (até '+MAXG+') ou troque um ativo, depois <b>inicie o ano</b>.<br><span style="color:var(--mut);font-size:12px">Cada gene tem vantagem E custo: observe o que a ilha andou fazendo…</span>');
    const ch=document.createElement('div');
    ch.className='rowB';
    const b1=document.createElement('button');
    b1.className='btn';b1.style.cssText='background:var(--g);color:#04150b;font-weight:800;border:0';
    b1.textContent='▶ Iniciar ano '+year+(swapTrait?' (troca pendente)':'');
    if(swapTrait)b1.disabled=true;
    b1.addEventListener('click',runYear);
    ch.appendChild(b1);
    pb.appendChild(ch);
  }else if(phase==='sim'||phase==='over'){
    pb.innerHTML='<b>Simulação do ano em andamento…</b> Acompanhe as crises no histórico abaixo.';
  }
  // se adapt & swapTrait: clique em traço ativo substitui
  if(swapTrait){
    at.querySelectorAll('.tchip').forEach(chip=>{
      chip.style.cursor='pointer';
      chip.style.boxShadow='0 0 0 2px var(--bad)';
      chip.addEventListener('click',()=>replaceActive(active[[...at.children].indexOf(chip)]));
    });
  }
  // pool
  const pool=document.getElementById('tpool');pool.innerHTML='';
  TRAITS.forEach(t=>{
    const d=document.createElement('div');
    d.className='tcard'+(active.includes(t.id)?'':'')+(swapTrait&&swapTrait.id===t.id?' selTrait':'');
    if(active.includes(t.id)){
      d.style.opacity=.45;
      d.innerHTML='<b>'+t.ic+' '+t.n+'</b> <span style="float:right;color:var(--g)">✓ ativo</span><p>'+t.d+'</p>';
    }else{
      d.innerHTML='<b>'+t.ic+' '+t.n+'</b><p>'+t.d+'</p><p><span class="pf">+ '+t.pf+'</span><br><span class="ng">− '+t.ng+'</span></p>';
      d.addEventListener('click',()=>selTrait(t));
    }
    pool.appendChild(d);
  });
}
document.getElementById('rstBtn').addEventListener('click',restart);
function showHelp(){sfx('click');
  document.getElementById('resBox').innerHTML='<h2 style="color:var(--g)">Como jogar</h2>'+
  '<p>Sua espécie precisa sobreviver <b>'+YEARS+' anos</b> em uma ilha hostil. A cada ano, o ambiente traz <b>crises</b> (seca, frio, predadores novos, fome, tempestades, noites longas, pragas).</p>'+
  '<p><b>Antes de cada ano</b>, você ativa <b>1 gene novo</b> (máx '+MAXG+') ou troca um ativo. Cada gene dá vantagem contra certas crises, mas tem <b>custo</b>: velocidade, reprodução ou alimentação.</p>'+
  '<p>Leia as crises do ano anterior no histórico — a ilha repete padrões. Equilíbrio vence: especializar demais deixa sua espécie frágil no resto.</p>'+
  '<p>Pontue sobrevivendo os '+YEARS+' anos com uma população grande e genes variados.</p>'+
  '<div class="rowB"><button class="btn" style="background:var(--g);color:#04150b;font-weight:800;border:0" onclick="closeBig()">Entendi</button></div>';
  document.getElementById('big').classList.add('open');
}
document.getElementById('helpBtn').addEventListener('click',showHelp);
newRun();
</script>
</body>
</html>
