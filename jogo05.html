let AC=null;
function tone(f,d,type,g,when){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(when||0),o=AC.createOscillator(),v=AC.createGain();o.type=type||'square';o.frequency.value=f;v.gain.value=g||.04;o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d);o.onended=function(){o.disconnect();v.disconnect();};}catch(e){}}
function sfx(k){if(k==='ok'){tone(620,.09,'square',.05);tone(930,.14,'square',.05,.08);}else if(k==='bad')tone(200,.2,'sawtooth',.055);else if(k==='click')tone(480,.04,'square',.03);else if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.14,'square',.05,i*.11));}else if(k==='ev')tone(300,.1,'sine',.05);}

/* helpers de caso */
function cur(){return CASES[caseIdx];}
function newCase(i){
  caseIdx=i;C=cur();timer=C.hours;tries=0;stateOver=false;
  document.getElementById('evs').innerHTML='';
  boardState={};selEv=null;
  gotEv=new Set();seenEv=new Set();notes=[];
  renderLocs();renderEvs();renderHud();
  document.getElementById('logN').innerHTML='📌 '+C.desc+'<br>Você tem <b>'+C.hours+' horas</b> (1 ação por hora; teoria errada custa 2h). Cada visita rende pistas. Quando tiver uma teoria, monte a cadeia e feche o caso.';
  document.getElementById('msgline').textContent='Comece pelo local do ocorrido — ou interrogue quem estava perto.';
  document.getElementById('notes').textContent='';
  document.getElementById('boardW').style.display='none';
  document.getElementById('big').classList.remove('open');
}
let notes=[];
/* visita */
function visit(l){
  if(stateOver)return;
  const idx=l.i;
  if(timer<=0){return;}
  const loc=C.visits[idx];
  if(!loc)return;
  if(loc.need&&!gotEv.has(loc.need)){setMsg('Faltam pistas: primeiro encontre “'+evName(loc.need)+'”.','bad');sfx('bad');return;}
  timer--;
  sfx('ev');
  const got=loc.give;
  got.forEach(g=>{const e=evById(g); if(e&&!seenEv.has(g)){seenEv.add(g);}});
  const news=[];
  got.forEach(g=>{const e=evById(g); if(e&&!gotEv.has(g)){gotEv.add(g);news.push(e);}});
  renderLocs();renderEvs();renderHud();
  logN('<b>'+loc.loc+'</b>'+(loc.note?' — '+loc.note:''));
  const mx=document.getElementById('resBox');
  mx.innerHTML='<h2 style="color:var(--ac)">'+loc.loc+'</h2>'+
   '<p>'+(loc.note||'')+'</p>'+
   (news.length?'<p style="color:var(--ok)">🔎 Novas evidências coletadas ('+news.length+').</p>':'<p>Nada de novo por aqui.</p>')+
   '<div class="rowB"><button class="btn sol" onclick="closeBig()">Continuar investigando</button></div>';
  document.getElementById('big').classList.add('open');
}
let gotEv=new Set(),seenEv=new Set();
function logN(html){const el=document.getElementById('logN');el.innerHTML=html;el.className='notif';}
function evById(id){for(const e of cur().evs)if(e.id===id)return e;return null;}
function evName(id){const e=evById(id);return e?e.txt.slice(0,42)+'…':id;}
function setMsg(t,cls){const el=document.getElementById('msgline');el.textContent=t;el.className='msgline'+(cls?' '+cls:'');}

function renderHud(){
  document.getElementById('caseNo').textContent=caseIdx+1;
  document.getElementById('tLeft').textContent=Math.max(0,timer);
  document.getElementById('tLeft2').textContent=Math.max(0,timer);
  document.getElementById('cTitle').textContent=C.name;
  document.getElementById('cDesc').textContent=C.person;
  document.getElementById('evN').textContent=gotEv.size;
}
function renderLocs(){
  const b=document.getElementById('locs');b.innerHTML='';
  C.visits.forEach((l,i)=>{
    const bt=document.createElement('button');
    bt.className='locBtn';
    const locked=l.need&&!gotEv.has(l.need);
    bt.innerHTML='<b>'+l.loc+'</b>'+(l.give.length?' <span class="tag">'+l.give.length+' pista'+(l.give.length>1?'s':'')+'</span>':'');
    bt.disabled=timer<=0||stateOver||locked;
    if(locked)bt.style.opacity=.5;
    bt.addEventListener('click',()=>visit({i}));
    b.appendChild(bt);
  });
  if(timer<=0&&!stateOver)setMsg('⏰ Seu tempo acabou — a polícia vai prender o suspeito errado. Feche o caso agora ou recomece.','bad');
}
function renderEvs(){
  const b=document.getElementById('evs');b.innerHTML='';
  cur().evs.forEach(e=>{
    if(!gotEv.has(e.id))return;
    const d=document.createElement('div');
    d.className='evCard'+(selEv===e.id?' sel':'')+(boardUsed(e.id)?' used':'');
    d.innerHTML='<span class="tp">'+e.tp+'</span>'+e.txt;
    d.addEventListener('click',()=>{
      sfx('click');
      if(boardUsed(e.id)){setMsg('Esta pista já está no quadro.','');return;}
      selEv=(selEv===e.id?null:e.id);
      renderEvs();
      if(selEv){
        setMsg('Agora coloque a pista em uma pessoa no quadro (ou toque nela de novo para cancelar).');
        showBoardHint();
      }
    });
    b.appendChild(d);
  });
  if(!cur().evs.some(e=>gotEv.has(e.id))){
    b.innerHTML='<div style="color:var(--mut);font-size:13px">Nenhuma evidência ainda. Visite os locais do mapa ao lado — cada visita custa 1 hora.</div>';
  }
}
function boardUsed(id){for(const k in boardState)if(boardState[k]===id)return true;return false;}
function openBoard(){document.getElementById('boardW').style.display='block';renderBoard();}
function showBoardHint(){openBoard();setMsg('Escolha a linha do suspeito e a coluna que a pista preenche. Toque na célula para soltar a pista.');}

/* quadro de teoria: linhas = pessoas; colunas Local/Horário/Objeto/Testemunha+Motivo */
function renderBoard(){
  const box=document.getElementById('board');box.innerHTML='';
  const cols=['LOCAL','HORÁRIO','OBJETO','TESTEMUNHA'];
  cols.forEach(c=>{const h=document.createElement('div');h.className='bhead';h.textContent=c;box.appendChild(h);});
  C.persons.forEach((p,pi)=>{
    const lab=document.createElement('div');lab.className='rowP';
    lab.innerHTML='<span class="ph">'+p.init+'</span>'+p.nome;
    lab.style.cssText='grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:6px 0 2px;font-weight:700;color:#cfe0ff;'+(pi? 'margin-top:14px':'');
    box.appendChild(lab);
    cols.forEach((c,ci)=>{
      const key=pi+'_'+ci;
      const cell=document.createElement('div');
      cell.className='cell'+(boardState[key]?' filled':'');
      cell.id='cell_'+key;
      const e=boardState[key]?evById(boardState[key]):null;
      cell.innerHTML=e?'<b>'+e.txt.slice(0,70)+(e.txt.length>70?'…':'')+'</b><span class="rm">remover ✕</span>':'<small>pista de '+c.toLowerCase()+'?</small>';
      if(boardState[key]){
        cell.querySelector('.rm').addEventListener('click',()=>{delete boardState[key];selEv=null;renderBoard();renderEvs();});
      }else{
        cell.addEventListener('click',()=>{
          if(!selEv){setMsg('Toque primeiro em uma evidência para selecioná-la.','');return;}
          boardState[key]=selEv;selEv=null;renderBoard();renderEvs();
          sfx('ok');
        });
      }
      box.appendChild(cell);
    });
  });
  // chave de avaliação (para o relatório)
}
function showTheory(){
  openBoard();
  setMsg('Monte a cadeia: para cada suspeito, associe as pistas que você acha que o incriminam. Fechar exige precisão.');
}
function evaluate(){
  if(stateOver)return;
  const filled=Object.keys(boardState).length;
  if(filled<4){setMsg('Teoria incompleta: coloque ao menos 4 pistas no quadro antes de fechar.','bad');sfx('bad');return;}
  const solIds=C.chain.slice();
  // células corretas: cada pista da solução deve estar associada ao suspeito correto (qualquer coluna)
  const corr={};
  solIds.forEach(id=>corr[id]=1);
  let ok=0,err=0;
  const wrong=[];
  for(const k in boardState){
    const id=boardState[k];
    if(corr[id])ok++;else{err++;wrong.push(id);}
  }
  // exige TODAS as 4 pistas do culpado
  let miss=0;
  solIds.forEach(id=>{if(!Object.values(boardState).includes(id))miss++;});
  const complete=err===0&&miss===0;
  tries++;
  if(complete){
    stateOver=true;
    const st=Math.min(3,Math.max(1,4-(filled-4)-tries));
    if(caseIdx+1>=unlock&&caseIdx+1<CASES.length){unlock=caseIdx+2;save();}
    const key='c'+(caseIdx+1);
    if(!best[key]||st>best[key]){best[key]=st;save();}
    sfx('win');
    const mx=document.getElementById('resBox');
    mx.innerHTML='<div class="big">🔒</div><h2 style="color:var(--ok)">Caso resolvido!</h2><p><b>'+C.persons[C.culprit].nome+'</b> foi o responsável.</p><p>'+C.sol+'</p>'+
     '<p>Pontuação: <b>'+st+'/3 estrelas</b> · tentativas: '+tries+' · pistas usadas: '+filled+'</p>'+
     '<div class="rowB">'+(caseIdx+1<CASES.length?'<button class="btn sol" onclick="openCase('+(caseIdx+1)+')">Próximo caso →</button>':'')+
     '<button class="btn" onclick="openCase(0)">Recomeçar a série</button><button class="btn" onclick="closeBig();startOver()">Repetir caso</button></div>';
    document.getElementById('big').classList.add('open');
  }else{
    sfx('bad');
    timer=Math.max(0,timer-2);
    renderHud();renderLocs();
    const hints=miss?('<br>— Faltam '+miss+' pista(s) essenciais para apontar o verdadeiro responsável.'):('<br>— '+err+' pista(s) apontam para inocentes. Remova-as.');
    const mx=document.getElementById('resBox');
    if(tries>=2||timer<=0){
      stateOver=true;
      mx.innerHTML='<div class="big">📁</div><h2 style="color:var(--bad)">Caso arquivado sem solução</h2>'+
       '<p>Suas horas acabaram'+(tries>=2?' (e as 2 tentativas de teoria se esgotaram)':'')+'. A delegacia arquivou o caso e o verdadeiro responsável escapou.</p>'+
       '<p>Quem era: <b>'+C.persons[C.culprit].nome+'</b>. '+C.sol+'</p>'+
       '<div class="rowB"><button class="btn sol" onclick="closeBig();startOver()">Tentar de novo (mesmo caso)</button>'+
       '<button class="btn" onclick="openCase('+Math.min(caseIdx+1,CASES.length-1)+')">Ir ao próximo caso</button></div>';
      document.getElementById('big').classList.add('open');
    }else{
      mx.innerHTML='<div class="big">❌</div><h2 style="color:var(--bad)">Teoria rejeitada pela delegacia</h2><p>'+(miss?'O relatório não conecta o responsável real aos fatos.':'O relatório incrimina gente inocente.')+hints+'</p>'+
       '<p style="color:var(--mut)">Tentativa '+tries+'/2 · você perdeu 2 horas. Pode ajustar o quadro e tentar de novo.</p>'+
       '<div class="rowB"><button class="btn sol" onclick="closeBig()">Revisar o quadro</button></div>';
      document.getElementById('big').classList.add('open');
    }
  }
}
function startOver(){caseIdx=caseIdx;newCase(caseIdx);closeBig();}
function openCase(i){newCase(i);}
function closeBig(){document.getElementById('big').classList.remove('open');}

/* help */
function showHelp(){sfx('click');
 const mx=document.getElementById('resBox');
 mx.innerHTML='<h2 style="color:var(--ac)">Como investigar</h2>'+
 '<p><b>1. Explore:</b> você tem horas limitadas (1 ação = 1 hora). Cada local do mapa rende pistas; algumas exigem pistas anteriores (ficam bloqueadas até você as obter).</p>'+
 '<p><b>2. Analise:</b> leia as evidências com atenção — local, horário, objeto, testemunhas e motivos se encaixam para formar uma cadeia.</p>'+
 '<p><b>3. Monte a teoria:</b> no quadro, associe as pistas ao suspeito que elas incriminam.</p>'+
 '<p><b>4. Feche o caso:</b> para resolver, as <b>4 pistas essenciais</b> do verdadeiro responsável devem estar no quadro, sem nenhuma pista de inocente. Você tem 2 tentativas por caso e ganha até 3 estrelas.</p>'+
 '<div class="rowB"><button class="btn sol" onclick="closeBig()">Entendi</button></div>';
 document.getElementById('big').classList.add('open');
}
/* listeners */
document.getElementById('helpBtn').addEventListener('click',showHelp);
document.getElementById('rstBtn').addEventListener('click',()=>{startOver();});
document.getElementById('solveBtn').addEventListener('click',evaluate);
// botão "abrir quadro": sempre visível no painel de evidências
(function(){
  const btn=document.createElement('button');
  btn.className='btn sol';btn.style.cssText='width:100%;margin-top:10px';
  btn.textContent='🧩 Abrir quadro de teoria / fechar caso';
  btn.addEventListener('click',()=>{if(stateOver)return;showTheory();});
  document.getElementById('evs').parentElement.appendChild(btn);
})();
newCase(0);
</script>
